policy:
  name: AIGDMM-SRS-Execution-Policy
  version: v1.1
  applies_to: SRS
  description: >
    Execution and governance policy for SRS documents.
    This policy defines AI visibility, executability, transformation rules,
    and structural rendering behavior aligned with AIGDMM.

# -------------------------------------------------------------------
# Global Defaults
# -------------------------------------------------------------------
global:
  default_visibility: human_only
  default_executable: false
  default_include_in_transformation: false

  default_render_policy:
    omit_if_empty: false   # By default, sections are expected to exist

  violation_handling:
    on_violation: terminate_execution
    log_level: error

# -------------------------------------------------------------------
# Section-Level Policies (Aligned with SRS_Template_v1.0)
# -------------------------------------------------------------------
sections:

  # ===============================================================
  # 0. Change History
  # ===============================================================
  "0":
    name: Change History
    visibility: human_only
    executable: false
    include_in_transformation: false
    render_policy:
      omit_if_empty: false   # Must always exist (document governance)

  # ===============================================================
  # 1. Introduction
  # ===============================================================
  "1":
    name: Introduction
    visibility: human_only
    executable: false
    include_in_transformation: false
    render_policy:
      omit_if_empty: false

    subsections:
      "1.1": { name: Purpose }
      "1.2": { name: Scope }
      "1.3": { name: Definitions, Acronyms, Abbreviations }
      "1.4": { name: References }
      "1.5": { name: Document Overview }

  # ===============================================================
  # 2. Overall Description
  # ===============================================================
  "2":
    name: Overall Description
    visibility: human_only
    executable: false
    include_in_transformation: false
    render_policy:
      omit_if_empty: false

    subsections:
      "2.1": { name: Product Perspective }
      "2.2": { name: Product Functions }
      "2.3": { name: User Classes and Characteristics }
      "2.4": { name: Operating Environment }
      "2.5": { name: Design and Implementation Constraints }
      "2.6": { name: Assumptions and Dependencies }

  # ===============================================================
  # 3. Functional Requirements (Core section, MUST exist)
  # ===============================================================
  "3":
    name: Functional Requirements
    visibility: ai_read
    executable: true
    include_in_transformation: true
    render_policy:
      omit_if_empty: false   # Core requirements MUST be present

    item_policy:
      id_pattern: "^FR-[A-Za-z0-9_-]+$"
      required_fields:
        - TITLE
        - DESCRIPTION
        - ACCEPTANCE_CRITERIA
      optional_fields:
        - RATIONALE

  # ===============================================================
  # 4. Non-Functional Requirements (Omittable)
  # ===============================================================
  "4":
    name: Non-Functional Requirements
    visibility: ai_read
    executable: true
    include_in_transformation: true
    render_policy:
      omit_if_empty: true    # Entire section may be omitted if empty

    categories:
      "4.1":
        type: Performance
        id_pattern: "^NFR-PERF-[A-Za-z0-9_-]+$"

      "4.2":
        type: Security
        id_pattern: "^NFR-SEC-[A-Za-z0-9_-]+$"

      "4.3":
        type: Reliability
        id_pattern: "^NFR-REL-[A-Za-z0-9_-]+$"

      "4.4":
        type: Usability
        id_pattern: "^NFR-USA-[A-Za-z0-9_-]+$"

      "4.5":
        type: Maintainability
        id_pattern: "^NFR-MAI-[A-Za-z0-9_-]+$"

      "4.6":
        type: Portability
        id_pattern: "^NFR-POR-[A-Za-z0-9_-]+$"

    required_fields:
      - TITLE
      - DESCRIPTION
      - ACCEPTANCE_CRITERIA

  # ===============================================================
  # 5. Business Rules (Omittable)
  # ===============================================================
  "5":
    name: Business Rules
    visibility: ai_read
    executable: true
    include_in_transformation: true
    render_policy:
      omit_if_empty: true

    item_policy:
      id_pattern: "^BR-[A-Za-z0-9_-]+$"
      required_fields:
        - DESCRIPTION
        - ACCEPTANCE_CRITERIA

  # ===============================================================
  # 6. User Interface Requirements (Omittable)
  # ===============================================================
  "6":
    name: User Interface Requirements
    visibility: ai_read
    executable: true
    include_in_transformation: true
    render_policy:
      omit_if_empty: true    # If no valid items, do not render this section

    item_policy:
      id_pattern: "^UIR-[A-Za-z0-9_-]+$"
      required_fields:
        - DESCRIPTION
        - ACCEPTANCE_CRITERIA

  # ===============================================================
  # 7. External Interface Requirements (Omittable)
  # ===============================================================
  "7":
    name: External Interface Requirements
    visibility: ai_read
    executable: true
    include_in_transformation: true
    render_policy:
      omit_if_empty: true

    subsections:
      "7.1":
        name: API Interfaces
        render_policy:
          omit_if_empty: true
        item_policy:
          id_pattern: "^API-[A-Za-z0-9_-]+$"
          required_fields:
            - DESCRIPTION
            - ENDPOINTS
            - DATA_FORMAT

      "7.2":
        name: Data Interfaces
        render_policy:
          omit_if_empty: true
        item_policy:
          id_pattern: "^DATA-IF-[A-Za-z0-9_-]+$"
          required_fields:
            - DESCRIPTION
            - DATA_SCHEMA
            - DIRECTION

  # ===============================================================
  # 8. System Constraints (Omittable)
  # ===============================================================
  "8":
    name: System Constraints
    visibility: ai_read
    executable: true
    include_in_transformation: true
    render_policy:
      omit_if_empty: true

    item_policy:
      id_pattern: "^CON-[A-Za-z0-9_-]+$"
      required_fields:
        - DESCRIPTION

  # ===============================================================
  # Appendix (Informative, Human-Owned)
  # ===============================================================
  "A":
    name: Appendix
    visibility: human_only
    executable: false
    include_in_transformation: false
    render_policy:
      omit_if_empty: false   # Appendix structure must be preserved
