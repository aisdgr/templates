document: CAS
version: 1.0.0
stage: Draft
owner: AIGD Foundation
description: >
  Execution policy for Coding Architecture Specification (CAS).
  This policy governs which sections are executable, visible to AI,
  and included in downstream transformation or trace pipelines.

# ----------------------------------------------------------
# Global Rules
# ----------------------------------------------------------
global:
  language: en-US
  default_visibility: ai_read
  default_executable: true
  default_include_in_transformation: true

  render_policy:
    omit_section_if_empty: true
    allow_section_reindex: true

# ----------------------------------------------------------
# Section Policies
# ----------------------------------------------------------
sections:

  "0":
    name: Change History
    visibility: human_only
    executable: false
    include_in_transformation: false

  "1":
    name: Introduction
    visibility: ai_read
    executable: true
    include_in_transformation: true

    subsections:
      "1.1":
        name: Purpose
        required: true
      "1.2":
        name: Scope
        required: true
      "1.3":
        name: Definitions, Acronyms, Abbreviations
        required: false
      "1.4":
        name: References
        required: false
      "1.5":
        name: Document Overview
        required: false

  "2":
    name: Architectural Context
    visibility: ai_read
    executable: true
    include_in_transformation: true

    constraints:
      prohibit_implementation_detail: true

    subsections:
      "2.1":
        name: Context Overview
        required: true
      "2.2":
        name: In-Scope Concerns
        required: false
      "2.3":
        name: Out-of-Scope Concerns
        required: false

  "3":
    name: Module Boundary Architecture
    visibility: ai_read
    executable: true
    include_in_transformation: true

    constraints:
      prohibit_implementation_detail: true
      prohibit_behavior_change: true
      prohibit_responsibility_expansion: true

    subsections:
      "3.1":
        name: Module Boundary Overview
        required: true

      "3.2":
        name: Module Definitions
        item_policy:
          id_pattern: "^MB-[A-Za-z0-9_-]+$"
          required_fields:
            - MODULE_NAME
            - MODULE_RESPONSIBILITY
            - MODULE_IN_SCOPE
            - MODULE_OUT_OF_SCOPE

      "3.3":
        name: Inter-Module Boundary Rules
        item_policy:
          id_pattern: "^MBR-[A-Za-z0-9_-]+$"
          required_fields:
            - MODULE_BOUNDARY_RULE_DESCRIPTION

      "3.4":
        name: Module Evolution Constraints
        item_policy:
          id_pattern: "^MEC-[A-Za-z0-9_-]+$"
          required_fields:
            - MODULE_EVOLUTION_CONSTRAINT_DESCRIPTION

  "4":
    name: Architectural Constraints
    visibility: ai_read
    executable: true
    include_in_transformation: true

    item_policy:
      id_pattern: "^AC-[A-Za-z0-9_-]+$"
      required_fields:
        - AC_TITLE
        - AC_DESCRIPTION
        - AC_RATIONALE

  "5":
    name: Runtime and Execution Constraints
    visibility: ai_read
    executable: true
    include_in_transformation: true

    subsections:
      "5.1":
        name: Runtime Constraints
        item_policy:
          id_pattern: "^RC-[A-Za-z0-9_-]+$"
          required_fields:
            - RUNTIME_CONSTRAINT_DESCRIPTION

      "5.2":
        name: Execution Model Constraints
        item_policy:
          id_pattern: "^EC-[A-Za-z0-9_-]+$"
          required_fields:
            - EXECUTION_CONSTRAINT_DESCRIPTION

  "6":
    name: Dependency and Interaction Constraints
    visibility: ai_read
    executable: true
    include_in_transformation: true

    subsections:
      "6.1":
        name: Dependency Constraints
        item_policy:
          id_pattern: "^DC-[A-Za-z0-9_-]+$"
          required_fields:
            - DEPENDENCY_CONSTRAINT_DESCRIPTION

      "6.2":
        name: Interaction Constraints
        item_policy:
          id_pattern: "^IC-[A-Za-z0-9_-]+$"
          required_fields:
            - INTERACTION_CONSTRAINT_DESCRIPTION

  "7":
    name: Security and Isolation Constraints
    visibility: ai_read
    executable: true
    include_in_transformation: true

    item_policy:
      id_pattern: "^SC-[A-Za-z0-9_-]+$"
      required_fields:
        - SECURITY_CONSTRAINT_DESCRIPTION

  "8":
    name: Operational Constraints
    visibility: ai_read
    executable: true
    include_in_transformation: true

    item_policy:
      id_pattern: "^OC-[A-Za-z0-9_-]+$"
      required_fields:
        - OPERATIONAL_CONSTRAINT_DESCRIPTION

# ----------------------------------------------------------
# Appendices (Non-Executable)
# ----------------------------------------------------------
appendix:

  "A":
    name: Traceability Policy
    visibility: ai_policy
    executable: false
    include_in_transformation: false

  "B":
    name: Authoring and Structural Constraints
    visibility: ai_policy
    executable: false
    include_in_transformation: false

  "C":
    name: Notes
    visibility: human_only
    executable: false
    include_in_transformation: false
