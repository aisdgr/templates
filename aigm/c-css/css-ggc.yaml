# ============================================================
# CSS Generation Governance Constraints (GGC)
# ============================================================
# Generation governance rules for Coding Structure
# Specification (CSS).
#
# CSS defines coding-level structural responsibilities ONLY.
# CSS MUST NOT contain behavior, logic, algorithm, or execution.
#
# CSS is NOT a generative document.
# AI generation is almost entirely prohibited.
#
# Rules follow:
# - aigdmm-rule-unified.yaml
# - AIGD-CNL
# - Semantic section grouping based on css-template.md
# ============================================================

meta:                             # core
  spec: AIGDMM-RULE               # core
  version: 1.0                    # core
  rule_set: ggc                   # option
  owner: aigdmm                   # option
  status: active                  # option


rules:

  # ==========================================================
  # Global Generation Prohibition
  # ==========================================================
  - rule:
      id: GGC-CSS-GLOBAL-001
      title: CSS Content Generation Is Prohibited by Default
      description: >
        AI MUST NOT generate CSS content by default.
        CSS content MUST be explicitly authored by humans.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Introduction
        - Structural Elements
        - Structural Constraints
        - Change Governance

    intent:
      category: generation
      risk: hallucination

    roles:
      enforced_on: [ai]


  # ==========================================================
  # Placeholder-Only Generation (Explicit Instruction Required)
  # ==========================================================
  - rule:
      id: GGC-CSS-PLACEHOLDER-001
      title: CSS Generation Is Restricted to Explicit Placeholders
      description: >
        AI MAY generate CSS content only within explicitly declared placeholders.
        AI MUST NOT introduce content outside declared placeholders.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Purpose
        - Scope
        - References
        - Document Overview

    intent:
      category: generation
      risk: hallucination

    roles:
      enforced_on: [ai]


  # ==========================================================
  # Structural Element Generation Restriction
  # ==========================================================
  - rule:
      id: GGC-CSS-ELEMENT-001
      title: Structural Elements MUST NOT Be Generated
      description: >
        AI MUST NOT generate structural elements.
        Structural elements MUST be explicitly defined by humans.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Structural Element
        - NAME
        - TYPE
        - PATH
        - RESPONSIBILITY
        - BOUNDARY
        - TRACE

    intent:
      category: generation
      risk: hallucination

    roles:
      enforced_on: [ai]


  # ==========================================================
  # No Behavior or Logic Injection
  # ==========================================================
  - rule:
      id: GGC-CSS-NO-LOGIC-001
      title: Behavioral or Logical Content Is Strictly Prohibited
      description: >
        AI MUST NOT generate behavior, logic, algorithm, or execution content.
        CSS content MUST remain purely structural.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Structural Elements
        - Structural Constraints
        - Change Governance

    intent:
      category: generation
      risk: leakage

    roles:
      enforced_on: [ai]


  # ==========================================================
  # Trace Generation Restriction
  # ==========================================================
  - rule:
      id: GGC-CSS-TRACE-001
      title: Trace References MUST NOT Be Fabricated
      description: >
        AI MUST NOT fabricate or infer trace references.
        Trace references MUST be explicitly provided by humans.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - TRACE

    intent:
      category: generation
      risk: hallucination

    roles:
      enforced_on: [ai]


  # ==========================================================
  # Structural Constraints Generation
  # ==========================================================
  - rule:
      id: GGC-CSS-CONSTRAINT-001
      title: Structural Constraints Require Explicit Instruction
      description: >
        AI MUST NOT generate structural constraints autonomously.
        Structural constraints MAY be generated only with explicit instruction.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Structural Constraints

    intent:
      category: generation
      risk: drift

    roles:
      enforced_on: [ai]


  # ==========================================================
  # Change Governance Generation
  # ==========================================================
  - rule:
      id: GGC-CSS-CHANGE-001
      title: Change Governance MUST Be Human-Defined
      description: >
        AI MUST NOT define change governance rules.
        Change governance MUST be authored by humans.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Change Governance

    intent:
      category: generation
      risk: drift

    roles:
      enforced_on: [ai]


  # ==========================================================
  # Appendices Generation Restriction
  # ==========================================================
  - rule:
      id: GGC-CSS-APP-001
      title: CSS Appendices Are Not Generative Targets
      description: >
        AI MUST NOT generate appendix content by default.
        Appendix generation MUST require explicit human instruction.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Traceability Policy
        - Authoring and Structural Constraints
        - Notes

    intent:
      category: generation
      risk: drift

    roles:
      enforced_on: [ai]


# ============================================================
# Appendix: AIGD-CNL
# ============================================================
#
# All rule.description fields MUST follow AIGD-CNL.
#
# ============================================================
