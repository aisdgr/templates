# ============================================================
# CSS Governance Enforcement Constraints (GEC)
# ============================================================
# Governance rules for Coding Structure Specification (CSS).
#
# CSS defines coding-level structural responsibilities ONLY.
# CSS MUST NOT define behavior, logic, algorithm, or flow.
#
# Rules follow:
# - aigdmm-rule-unified.yaml
# - AIGD-CNL
# - Semantic section grouping based on css-template.md
# ============================================================

meta:                             # core
  spec: AIGDMM-RULE               # core
  version: 1.0                    # core
  rule_set: gec                   # option
  owner: aigdmm                   # option
  status: active                  # option


rules:

  # ==========================================================
  # 0. Change History
  # ==========================================================
  - rule:
      id: GEC-CSS-CH-001
      title: Change History Is Informative Only
      description: >
        The Change History section MUST be informative only.
        The Change History section MUST NOT define structural responsibilities.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Change History

    intent:
      category: structure
      risk: drift

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # 1. Introduction
  # ==========================================================
  - rule:
      id: GEC-CSS-INTRO-001
      title: Introduction Is Descriptive Only
      description: >
        Introduction sections MUST be descriptive only.
        Introduction sections MUST NOT define structural responsibilities.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Introduction
        - Purpose
        - Scope
        - Definitions
        - References
        - Document Overview

    intent:
      category: structure
      risk: ambiguity

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # 2. Structural Elements
  # ==========================================================
  - rule:
      id: GEC-CSS-SE-001
      title: Structural Elements Define Single Responsibility Only
      description: >
        Each structural element MUST define one and only one responsibility.
        Structural elements MUST NOT imply behavior or execution flow.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Structural Elements
        - Structural Element

    intent:
      category: safety
      risk: leakage

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Structural Element Mandatory Fields
  # ==========================================================
  - rule:
      id: GEC-CSS-SE-FIELD-001
      title: Structural Element Mandatory Fields Are Fixed
      description: >
        Each structural element MUST declare NAME, TYPE, and PATH.
        No additional mandatory fields MUST be introduced.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - NAME
        - TYPE
        - PATH

    intent:
      category: structure
      risk: ambiguity

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Responsibility Definition
  # ==========================================================
  - rule:
      id: GEC-CSS-RESP-001
      title: Responsibility Must Be Purely Structural
      description: >
        Responsibility definitions MUST describe structural responsibility only.
        Responsibility definitions MUST NOT describe logic, behavior, or algorithms.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - RESPONSIBILITY

    intent:
      category: safety
      risk: leakage

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Boundary (Optional)
  # ==========================================================
  - rule:
      id: GEC-CSS-BND-001
      title: Boundary Definitions Must Be Declarative
      description: >
        Boundary definitions MUST be declarative and structural.
        Boundary definitions MUST NOT prescribe enforcement mechanisms.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - BOUNDARY

    intent:
      category: structure
      risk: ambiguity

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Traceability
  # ==========================================================
  - rule:
      id: GEC-CSS-TRACE-001
      title: Structural Elements Must Declare Traceability
      description: >
        Each structural element MUST declare traceability references.
        Traceability MUST reference upstream specifications explicitly.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - TRACE

    intent:
      category: safety
      risk: ambiguity

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # 3. Structural Constraints
  # ==========================================================
  - rule:
      id: GEC-CSS-CON-001
      title: Structural Constraints Must Be Declarative
      description: >
        Structural constraints MUST be declarative and enforceable.
        Structural constraints MUST NOT imply implementation behavior.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Structural Constraints

    intent:
      category: safety
      risk: leakage

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # 4. Change Governance
  # ==========================================================
  - rule:
      id: GEC-CSS-CG-001
      title: Change Governance Must Be Explicit
      description: >
        Change governance rules MUST be explicitly declared.
        Change governance MUST define allowed and disallowed change scopes.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Change Governance

    intent:
      category: safety
      risk: drift

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Appendix A – Traceability Policy
  # ==========================================================
  - rule:
      id: GEC-CSS-APP-A-001
      title: Traceability Policy Is Informative Only
      description: >
        The traceability policy appendix MUST be informative only.
        The traceability policy MUST NOT define structural responsibilities.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Traceability Policy

    intent:
      category: structure
      risk: drift

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Appendix B – Authoring and Structural Constraints
  # ==========================================================
  - rule:
      id: GEC-CSS-APP-B-001
      title: Authoring and Structural Constraints Are Mandatory
      description: >
        Authoring and structural constraints MUST be strictly followed.
        No additional sections or free-form content MUST be introduced.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Structural Rules
        - Content Rules

    intent:
      category: structure
      risk: drift

    roles:
      enforced_on: [ai]
      exempt: [human]


  # ==========================================================
  # Appendix C – Notes
  # ==========================================================
  - rule:
      id: GEC-CSS-APP-C-001
      title: Notes Are Informative Only
      description: >
        Notes sections MUST be informative only.
        Notes sections MUST NOT define structural responsibilities.
      severity: error

    applies_to:
      document_type: [CSS]
      sections:
        - Notes

    intent:
      category: structure
      risk: drift

    roles:
      enforced_on: [ai]
      exempt: [human]


# ============================================================
# Appendix: AIGD-CNL
# ============================================================
#
# All rule.description fields MUST follow AIGD-CNL.
#
# ============================================================
