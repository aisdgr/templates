# ==============================================================================
# devSCR-CODE-BD-02.yaml
# Code execution MUST stop if declared boundaries conflict.
# ==============================================================================

rule:
  id: devSCR-CODE-BD-02
  execution_view: boundary_engineer
  constraint: >
    Code execution MUST stop if multiple declared boundaries
    cannot be resolved into a single, deterministic execution scope.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - boundary
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: devSCR

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_ambiguous_execution_scope
        - avoid_conflicting_modification_targets

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - boundary_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_execution
      reason:
        - conflicting_boundaries
        - ambiguous_execution_scope

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - boundary_enforcement
        - execution_safety
        - auditability
