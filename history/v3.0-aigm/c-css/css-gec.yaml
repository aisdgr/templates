# ==============================================================================
# CSS – Global Engineering Constraints (GEC)
# ==============================================================================

document:

  # ---------------------------------------------------------------------------
  # Meta Information
  # ---------------------------------------------------------------------------
  meta:
    id: css-gec
    title: CSS Global Engineering Constraints
    version: 1.3
    status: active
    action: generate
    artifact: document
    owner: aigdmm

  # ---------------------------------------------------------------------------
  # Applicability Context (Structural Vocabulary Only)
  # ---------------------------------------------------------------------------
  applicability_context:

    # 1. Intent vocabulary (Why)
    intent:
      category:
        - structure
        - coding_structure
        - generation

    # 2. Role vocabulary (Who)
    roles:
      enforced_on:
      - ai
      - human
      exempt:
      - human
      responsible:
      - ai
      - human
      - system
      involvement:
      - primary
      - secondary
      - oversight

    # 3. Applies-to vocabulary (Where / What)
    applies_to:

      document_type:
        - CSS

      section:
        - Introduction
        - Purpose
        - Scope
        - Definitions
        - References
        - Document Overview
        - Structure Overview
        - Structural Context
        - Structural Responsibilities
        - Structural Hierarchy
        - Structural Elements
        - Packages
        - Classes
        - Functions
        - Files

      authority:
        - informative
        - authoritative

      generation:
        - human_only
        - ai_allowed
        - ai_required

      transformation:
        - allowed
        - forbidden

  # ---------------------------------------------------------------------------
  # Rules
  # ---------------------------------------------------------------------------
  rules:

    # ==========================================================
    # Introduction & Document Overview
    # ==========================================================
    - id: GEC-CSS-INTRO-001
      version: 1.0
      status: active
      title: Introduction Sections Are Informative Only

      description: >
        Introduction-related sections MUST be informative only.
        These sections MUST NOT define structural responsibilities,
        coding logic, or normative system behavior.

      intent:
        category: structure

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CSS
        section:
          - Introduction
          - Purpose
          - Scope
          - Definitions
          - References
          - Document Overview
        authority:
          - informative
        generation:
          - human_only
        transformation:
          - forbidden

      risk: transparency
      severity: medium

    # ==========================================================
    # Structure Overview
    # ==========================================================
    - id: GEC-CSS-STRUCT-001
      version: 1.0
      status: active
      title: Structure Overview Must Be Descriptive

      description: >
        Structure overview sections MUST describe the structural context
        and high-level hierarchy.
        These sections MUST NOT introduce implementation details,
        behavioral specifications, or coding logic.

      intent:
        category: coding_structure

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CSS
        section:
          - Structure Overview
          - Structural Context
          - Structural Responsibilities
          - Structural Hierarchy
        authority:
          - informative
        generation:
          - ai_allowed
        transformation:
          - forbidden

      risk: transparency
      severity: medium

    # ==========================================================
    # Structural Elements
    # ==========================================================
    - id: GEC-CSS-ELEM-001
      version: 1.0
      status: active
      title: Structural Elements Must Be Explicit

      description: >
        Structural elements sections MUST define explicit
        structural responsibilities with clear boundaries.
        Vague, implicit, or overlapping structural definitions MUST NOT be introduced.

      intent:
        category: coding_structure

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CSS
        section:
          - Structural Elements
          - Packages
          - Classes
          - Functions
          - Files
        authority:
          - authoritative
        generation:
          - ai_allowed
        transformation:
          - allowed

      risk: safety
      severity: high
