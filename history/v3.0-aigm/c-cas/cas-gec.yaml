# ==============================================================================
# CAS – Global Engineering Constraints (GEC)
# ==============================================================================

document:

  # ---------------------------------------------------------------------------
  # Meta Information
  # ---------------------------------------------------------------------------
  meta:
    id: cas-gec
    title: CAS Global Engineering Constraints
    version: 1.3
    status: active
    action: generate
    artifact: document
    owner: aigdmm

  # ---------------------------------------------------------------------------
  # Applicability Context (Structural Vocabulary Only)
  # ---------------------------------------------------------------------------
  applicability_context:

    # 1. Intent vocabulary (Why)
    intent:
      category:
        - structure
        - architecture
        - generation

    # 2. Role vocabulary (Who)
    roles:
      enforced_on:
      - ai
      - human
      exempt:
      - human
      responsible:
      - ai
      - human
      - system
      involvement:
      - primary
      - secondary
      - oversight

    # 3. Applies-to vocabulary (Where / What)
    applies_to:

      document_type:
        - CAS

      section:
        - Introduction
        - Purpose
        - Scope
        - Definitions, Acronyms, Abbreviations
        - References
        - Document Overview
        - Architectural Context
        - Context Overview
        - Architectural Principles
        - Architectural Layers
        - Module Structure
        - Architectural Constraints
        - Design Constraints
        - Technology Constraints
        - Integration Constraints
        - Interface Architecture

      authority:
        - informative
        - authoritative

      generation:
        - human_only
        - ai_allowed
        - ai_required

      transformation:
        - allowed
        - forbidden

  # ---------------------------------------------------------------------------
  # Rules
  # ---------------------------------------------------------------------------
  rules:

    # ==========================================================
    # Introduction & Document Overview
    # ==========================================================
    - id: GEC-CAS-INTRO-001
      version: 1.0
      status: active
      title: Introduction Sections Are Informative Only

      description: >
        Introduction-related sections MUST be informative only.
        These sections MUST NOT define architectural constraints,
        module boundaries, or normative system behavior.

      intent:
        category: structure

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CAS
        section:
          - Introduction
          - Purpose
          - Scope
          - Definitions, Acronyms, Abbreviations
          - References
          - Document Overview
        authority:
          - informative
        generation:
          - human_only
        transformation:
          - forbidden

      risk: transparency
      severity: medium

    # ==========================================================
    # Architectural Context
    # ==========================================================
    - id: GEC-CAS-ARCH-001
      version: 1.0
      status: active
      title: Architectural Context Must Be Descriptive

      description: >
        Architectural Context sections MUST describe the architectural scope
        and high-level boundaries.
        These sections MUST NOT introduce implementation details,
        specific technologies, or deployment decisions.

      intent:
        category: architecture

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CAS
        section:
          - Architectural Context
          - Context Overview
          - Architectural Principles
          - Architectural Layers
        authority:
          - informative
        generation:
          - ai_allowed
        transformation:
          - forbidden

      risk: transparency
      severity: medium

    # ==========================================================
    # Module Structure
    # ==========================================================
    - id: GEC-CAS-MODULE-001
      version: 1.0
      status: active
      title: Module Structure Must Be Explicit

      description: >
        Module structure sections MUST define explicit
        module boundaries and responsibility scopes.
        Vague, implicit, or overlapping module definitions MUST NOT be introduced.

      intent:
        category: architecture

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CAS
        section:
          - Module Structure
        authority:
          - authoritative
        generation:
          - ai_allowed
        transformation:
          - allowed

      risk: safety
      severity: high

    # ==========================================================
    # Architectural Constraints
    # ==========================================================
    - id: GEC-CAS-CONST-001
      version: 1.0
      status: active
      title: Architectural Constraints Must Be Explicitly Declared

      description: >
        Architectural constraint sections MUST explicitly declare
        design boundaries, technology constraints, and integration constraints.
        Implicit or inferred constraints MUST NOT be generated.

      intent:
        category: architecture

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CAS
        section:
          - Architectural Constraints
          - Design Constraints
          - Technology Constraints
          - Integration Constraints
        authority:
          - authoritative
        generation:
          - ai_allowed
        transformation:
          - forbidden

      risk: security
      severity: high
