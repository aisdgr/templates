document:
  meta:
    id: cas-contract
    title: CAS Contract
    version: 1.0
    status: active
    action: contract
    artifact: document
    owner: aigm

  applicability_context:
    intent:
      category:
        - structure
        - architecture
        - generation
        - rendering
        - validation
      source:
        - cas.template.md
        - cas.schema.yaml

    roles:
      enforced_on:
        - ai
        - human
        - system
      responsible:
      - ai
      - human
      - system
      involvement:
      - primary
      - secondary
      - oversight

    applies_to:
      section:
        - front_matter
        - change_history

        - introduction.purpose
        - introduction.scope
        - introduction.definitions
        - introduction.references
        - introduction.document_overview

        - architecture_overview.context
        - architecture_overview.principles
        - architecture_overview.layers
        - architecture_overview.components

        - architectural_constraints.design_constraints
        - architectural_constraints.technology_constraints
        - architectural_constraints.integration_constraints

        - module_structure.modules
        - module_structure.dependencies
        - module_structure.interfaces

      constraint:
        - required
        - generate_document
        - render_when_empty
        - pattern
        - unique
      template:
        - cas.template.md
      schema:
        - cas.schema.yaml

  rules:
    # --------------------------------------------------------------------------
    # Contract rules (independent)
    # --------------------------------------------------------------------------
    - id: CONTRACT-CAS-STRUCT-001
      title: Structure Follows CAS Template
      status: active
      description: CAS generator MUST follow the structure defined in cas.template.md.
      intent:
        - category: structure
        - source: cas.template.md
      roles:
        - enforced_on: ai
      applies_to:
      risk: transparency
      severity: high

    - id: CONTRACT-CAS-VALUE-001
      title: Values Conform to CAS Schema
      status: active
      description: CAS generator MUST ensure all field values conform to cas.schema.yaml.
      intent:
        - category: architecture
        - source: cas.schema.yaml
      roles:
        - enforced_on: ai
      applies_to:
      risk: transparency
      severity: high

    - id: CONTRACT-CAS-LIST-RENDER-001
      title: List Fields Render as Bullet Lists
      status: active
      description: CAS generator MUST render list-type fields as Markdown bullet lists.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
        - introduction.references
        - architecture_overview.principles
        - architecture_overview.layers
        - architecture_overview.components
        - module_structure.dependencies
      risk: transparency
      severity: medium

    - id: CONTRACT-CAS-REQUIRED-RENDER-001
      title: Required Fields Are Rendered
      status: active
      description: CAS generator MUST render all required fields in the output document.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - front_matter
          - change_history
          - introduction.purpose
          - architecture_overview.context
          - module_structure.modules
      risk: transparency
      severity: high

    - id: CONTRACT-CAS-GENERATE-DOC-RENDER-001
      title: Generate Document Fields Are Rendered
      status: active
      description: CAS generator MUST render fields marked generate_document as true.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - introduction.purpose
          - introduction.scope
          - architecture_overview.context
          - architecture_overview.principles
          - module_structure.modules
      risk: transparency
      severity: medium

    - id: CONTRACT-CAS-RENDER-WHEN-EMPTY-001
      title: Render When Empty Is Respected
      status: active
      description: CAS generator MUST render fields with render_when_empty set to true even when the value is empty.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - introduction.definitions
          - introduction.references
          - architectural_constraints.design_constraints
      risk: transparency
      severity: medium

    - id: CONTRACT-CAS-PATTERN-001
      title: Pattern Constraints Are Satisfied
      status: active
      description: CAS generator MUST ensure values match any declared pattern constraints.
      intent:
        - category: validation
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - front_matter
          - change_history
          - module_structure.modules
          - module_structure.interfaces
      risk: security
      severity: high

    - id: CONTRACT-CAS-UNIQUE-001
      title: Unique Constraints Are Satisfied
      status: active
      description: CAS generator MUST ensure values are unique where unique constraints are declared.
      intent:
        - category: validation
      roles:
        - enforced_on: ai
      applies_to:
        - constraint: unique
      risk: transparency
      severity: high
