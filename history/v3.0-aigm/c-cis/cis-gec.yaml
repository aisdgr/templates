# ==============================================================================
# CIS – Global Engineering Constraints (GEC)
# ==============================================================================

document:

  # ---------------------------------------------------------------------------
  # Meta Information
  # ---------------------------------------------------------------------------
  meta:
    id: cis-gec
    title: CIS Global Engineering Constraints
    version: 1.3
    status: active
    action: generate
    artifact: document
    owner: aigdmm

  # ---------------------------------------------------------------------------
  # Applicability Context (Structural Vocabulary Only)
  # ---------------------------------------------------------------------------
  applicability_context:

    # 1. Intent vocabulary (Why)
    intent:
      category:
        - structure
        - conceptual
        - generation

    # 2. Role vocabulary (Who)
    roles:
      enforced_on:
      - ai
      - human
      exempt:
      - human
      responsible:
      - ai
      - human
      - system
      involvement:
      - primary
      - secondary
      - oversight

    # 3. Applies-to vocabulary (Where / What)
    applies_to:

      document_type:
        - CIS

      section:
        - Introduction
        - Purpose
        - Scope
        - Definitions, Acronyms, Abbreviations
        - References
        - Document Overview
        - Conceptual Model Overview
        - Conceptual Context
        - Conceptual Approach
        - Conceptual Patterns
        - Decision Structure

      authority:
        - informative
        - authoritative

      generation:
        - human_only
        - ai_allowed
        - ai_required

      transformation:
        - allowed
        - forbidden

  # ---------------------------------------------------------------------------
  # Rules
  # ---------------------------------------------------------------------------
  rules:

    # ==========================================================
    # Introduction & Document Overview
    # ==========================================================
    - id: GEC-CIS-INTRO-001
      version: 1.0
      status: active
      title: Introduction Sections Are Informative Only

      description: >
        Introduction-related sections MUST be informative only.
        These sections MUST NOT define conceptual rules,
        decision logic, or normative system behavior.

      intent:
        category: structure

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CIS
        section:
          - Introduction
          - Purpose
          - Scope
          - Definitions, Acronyms, Abbreviations
          - References
          - Document Overview
        authority:
          - informative
        generation:
          - human_only
        transformation:
          - forbidden

      risk: transparency
      severity: medium

    # ==========================================================
    # Conceptual Model Overview
    # ==========================================================
    - id: GEC-CIS-CONCEPT-001
      version: 1.0
      status: active
      title: Conceptual Model Must Be Descriptive

      description: >
        Conceptual model sections MUST describe the conceptual scope
        and high-level approach.
        These sections MUST NOT introduce execution flow,
        implementation logic, or algorithmic details.

      intent:
        category: conceptual

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CIS
        section:
          - Conceptual Model Overview
          - Conceptual Context
          - Conceptual Approach
          - Conceptual Patterns
        authority:
          - informative
        generation:
          - ai_allowed
        transformation:
          - forbidden

      risk: transparency
      severity: medium

    # ==========================================================
    # Decision Structure
    # ==========================================================
    - id: GEC-CIS-DECISION-001
      version: 1.0
      status: active
      title: Decision Structure Must Be Explicit

      description: >
        Decision structure sections MUST define explicit
        conceptual decisions with clear conditions and outcomes.
        Vague, implicit, or ambiguous decision definitions MUST NOT be introduced.

      intent:
        category: conceptual

      roles:
        enforced_on:
          - ai
        exempt:
          - human
        responsible:
          - ai
        involvement:
          - primary

      applies_to:
        document_type:
          - CIS
        section:
          - Decision Structure
        authority:
          - authoritative
        generation:
          - ai_allowed
        transformation:
          - allowed

      risk: safety
      severity: high
