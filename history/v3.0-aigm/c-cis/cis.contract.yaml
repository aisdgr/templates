document:
  meta:
    id: cis-contract
    title: CIS Contract
    version: 1.0
    status: active
    action: contract
    artifact: document
    owner: aigm

  applicability_context:
    intent:
      category:
        - structure
        - conceptual
        - generation
        - rendering
        - validation
      source:
        - cis.template.md
        - cis.schema.yaml

    roles:
      enforced_on:
        - ai
        - human
        - system
      responsible:
      - ai
      - human
      - system
      involvement:
      - primary
      - secondary
      - oversight

    applies_to:
      section:
        - front_matter
        - change_history

        - introduction.purpose
        - introduction.scope
        - introduction.definitions
        - introduction.references
        - introduction.document_overview

        - conceptual_overview.context
        - conceptual_overview.approach
        - conceptual_overview.patterns

        - conceptual_decisions.decisions
        - conceptual_decisions.rationale
        - conceptual_decisions.tradeoffs

      constraint:
        - required
        - generate_document
        - render_when_empty
        - pattern
        - unique
      template:
        - cis.template.md
      schema:
        - cis.schema.yaml

  rules:
    # --------------------------------------------------------------------------
    # Contract rules (independent)
    # --------------------------------------------------------------------------
    - id: CONTRACT-CIS-STRUCT-001
      title: Structure Follows CIS Template
      status: active
      description: CIS generator MUST follow the structure defined in cis.template.md.
      intent:
        - category: structure
        - source: cis.template.md
      roles:
        - enforced_on: ai
      applies_to:
      risk: transparency
      severity: high

    - id: CONTRACT-CIS-VALUE-001
      title: Values Conform to CIS Schema
      status: active
      description: CIS generator MUST ensure all field values conform to cis.schema.yaml.
      intent:
        - category: conceptual
        - source: cis.schema.yaml
      roles:
        - enforced_on: ai
      applies_to:
      risk: transparency
      severity: high

    - id: CONTRACT-CIS-LIST-RENDER-001
      title: List Fields Render as Bullet Lists
      status: active
      description: CIS generator MUST render list-type fields as Markdown bullet lists.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
        - introduction.references
        - conceptual_overview.patterns
        - conceptual_decisions.tradeoffs
      risk: transparency
      severity: medium

    - id: CONTRACT-CIS-REQUIRED-RENDER-001
      title: Required Fields Are Rendered
      status: active
      description: CIS generator MUST render all required fields in the output document.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - front_matter
          - change_history
          - introduction.purpose
          - conceptual_overview.context
          - conceptual_decisions.decisions
      risk: transparency
      severity: high

    - id: CONTRACT-CIS-GENERATE-DOC-RENDER-001
      title: Generate Document Fields Are Rendered
      status: active
      description: CIS generator MUST render fields marked generate_document as true.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - introduction.purpose
          - introduction.scope
          - conceptual_overview.context
          - conceptual_overview.approach
          - conceptual_decisions.decisions
      risk: transparency
      severity: medium

    - id: CONTRACT-CIS-RENDER-WHEN-EMPTY-001
      title: Render When Empty Is Respected
      status: active
      description: CIS generator MUST render fields with render_when_empty set to true even when the value is empty.
      intent:
        - category: rendering
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - introduction.definitions
          - introduction.references
          - conceptual_decisions.tradeoffs
      risk: transparency
      severity: medium

    - id: CONTRACT-CIS-PATTERN-001
      title: Pattern Constraints Are Satisfied
      status: active
      description: CIS generator MUST ensure values match any declared pattern constraints.
      intent:
        - category: validation
      roles:
        - enforced_on: ai
      applies_to:
        section:
          - front_matter
          - change_history
          - conceptual_decisions.decisions
      risk: security
      severity: high

    - id: CONTRACT-CIS-UNIQUE-001
      title: Unique Constraints Are Satisfied
      status: active
      description: CIS generator MUST ensure values are unique where unique constraints are declared.
      intent:
        - category: validation
      roles:
        - enforced_on: ai
      applies_to:
        - constraint: unique
      risk: transparency
      severity: high
