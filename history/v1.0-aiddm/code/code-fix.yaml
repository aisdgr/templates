task: code_fix
type: execution

role:
  name: Code Fixer
  authority: none

system_prompt:
  - Specifications are immutable and frozen
  - Code Scope is defined only by the active VDP
  - Any mismatch is an implementation defect
  - The AI must not reinterpret or extend specifications

context:
  read_only:
    - VDP.md: Code Scope
    - SRS.md
    - SDS.md
    - STS.md

task_definition:
  description: >
    Fix existing source code so that it strictly conforms
    to frozen specifications defined in SRS, SDS, and STS,
    within the Code Scope defined by the VDP.
  includes:
    - Correction of incomplete implementations
    - Correction of incorrect behavior
  excludes:
    - New feature development
    - Behavioral changes beyond specifications
    - Non-essential refactoring

constraints:
  must:
    - Modify code only within VDP Code Scope
    - Preserve architecture unless required for alignment
    - Follow SRS, SDS, and STS exactly
  must_not:
    - Modify specification documents
    - Infer or invent requirements
    - Add new functionality
    - Change public interfaces unless specified
    - Execute or generate tests
    - Generate Test Reports (TR)
    - Commit code

output:
  artifacts:
    - src/**
  additional_output:
    - list_of_modified_files

stop_condition:
  - Stop immediately after output generation
  - Wait for Human Gatekeeper review
  - No automatic continuation

responsibility:
  role: Producer
  verification: false
  approval: false
