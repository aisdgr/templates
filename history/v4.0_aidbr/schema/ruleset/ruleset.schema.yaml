# ==============================================================================
# ruleset.schema.yaml
# ID: dev-scr-ruleset-schema
# Version: 1.0.0
# Status: draft
# Description: 
#   Conceptual structural schema for grouping rules into governance sets.
#   Rulesets organize rule references for applicability and interpretation.
#   Meaning and enforcement are defined by external governance policy.
# ==============================================================================
# Conceptual Ruleset Schema
#
# This schema defines the structural boundaries for organizing multiple rules
# into decision-oriented constraint sets.
#
# Design Principles:
# - A Ruleset MUST NOT define any normative constraint or behavior.
# - A Ruleset only references existing rules by identifier.
# - A Ruleset represents a governance perspective, not execution logic.
# - All policy and domain semantics are descriptive and non-executable.
# ==============================================================================

# ------------------------------------------------------------------------------
# Schema Root
# ------------------------------------------------------------------------------
type: object
description: >
  Declarative ruleset definition.
  A ruleset is a governance artifact that groups and contextualizes
  multiple rules under a shared decision perspective.
  The schema defines structure only.

required:
  - ruleset

properties:

  # =============================================================================
  # Ruleset
  # =============================================================================
  ruleset:
    type: object
    description: >
      A ruleset defines a collection of rule references together with
      their shared applicability and governance context.
      A ruleset MUST NOT introduce new constraints.

    required:
      - id
      - governance
      - includes

    properties:

      # -------------------------------------------------------------------------
      # Ruleset Identifier
      # -------------------------------------------------------------------------
      id:
        type: string
        description: >
          Unique identifier of the ruleset.
          Used for reference, versioning, traceability,
          and governance discussions.

      # -------------------------------------------------------------------------
      # Includes (Rule References)
      # -------------------------------------------------------------------------
      includes:
        type: list
        description: >
          List of rule references included in this ruleset.
          Rules are referenced by identifier only.
          A ruleset MUST NOT override or modify rule definitions.

        item:
          type: object
          required:
            - rule_id
          properties:
            rule_id:
              type: string
              description: >
                Identifier of the referenced rule.
            version:
              type: string
              description: >
                Optional version constraint for the referenced rule.

      # -------------------------------------------------------------------------
      # Applicability (Decision Lens)
      # -------------------------------------------------------------------------
      applicability:
        type: map
        description: >
          Declares the decision scope in which this ruleset is applicable.
          This field defines a governance lens, NOT execution conditions,
          triggers, or control flow semantics.

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                Enterprise-defined applicability attributes.
                Keys and values are fully customizable.
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

      # -------------------------------------------------------------------------
      # Governance
      # -------------------------------------------------------------------------
      governance:
        type: object
        description: >
          Governance metadata associated with the ruleset.
          Governance information is descriptive and MUST NOT
          influence execution behavior.

        required:
          - version
          - status
          - owner

        properties:

          # ---------------------------------------------------------------------
          # Governance Version
          # ---------------------------------------------------------------------
          version:
            type: string
            description: >
              Version of the governance definition for this ruleset.
              Used for auditability and lifecycle tracking.

          # ---------------------------------------------------------------------
          # Governance Status
          # ---------------------------------------------------------------------
          status:
            type: string
            description: >
              Current governance status of the ruleset
              (e.g., active, draft, deprecated).

          # ---------------------------------------------------------------------
          # Governance Owner
          # ---------------------------------------------------------------------
          owner:
            type: string
            description: >
              Organization or authority responsible
              for governing this ruleset.

          # ---------------------------------------------------------------------
          # Intent (Optional Governance Annotation)
          # ---------------------------------------------------------------------
          intent:
            type: map
            description: >
              Optional governance annotation describing why the ruleset exists.
              Intent is informational and non-normative.
              It MUST NOT introduce execution logic.

            value:
              oneOf:
                - type: string
                - type: list
                  item:
                    type: string
                - type: object
                  description: >
                    Organization-defined intent attributes.
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: list
                        item:
                          type: string

          # ---------------------------------------------------------------------
          # Responsibilities
          # ---------------------------------------------------------------------
          responsibilities:
            type: map
            description: >
              Declares accountability of stakeholders related to the ruleset.
              Responsibilities do NOT affect execution behavior.

            value:
              type: object
              additionalProperties:
                type: list
                item:
                  type: string

          # ---------------------------------------------------------------------
          # Governance Impact
          # ---------------------------------------------------------------------
          governance_impact:
            type: map
            description: >
              Governance-level interpretation of outcomes and implications.
              This field is descriptive and non-executable.

            value:
              oneOf:
                - type: string
                - type: list
                  item:
                    type: string
                - type: object
                  description: >
                    Organization-defined impact attributes.
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: list
                        item:
                          type: string

# ------------------------------------------------------------------------------
# Validation Constraints
# ------------------------------------------------------------------------------
additionalProperties: false
