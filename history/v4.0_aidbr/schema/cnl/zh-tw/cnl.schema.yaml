# ==============================================================================
# cnl.schema.yaml
# ID: dev-scr-cnl-generate-schema
# 版本: 1.0.0
# 狀態: 草案 (draft)
# 描述: 
#   定義生成之 CNL 陳述句結構的結構定義，
#   用於約束 AI 行為。
# ==============================================================================
# CNL 結構定義 (CNL Schema)
#
# 本結構定義了使用受控自然語言 (CNL) 表達規範性約束的結構。
#
# 設計原則：
# - 陳述句 (Statements) 是規範性 AI 約束的主要載體。
# - 選填的語義提示（主體、動作等）不具備可執行性。
# - 結構針對機器處理與人工審計進行了最佳化。
# ==============================================================================

# ------------------------------------------------------------------------------
# 結構根節點 (Schema Root)
# ------------------------------------------------------------------------------
type: object
description: >
  CNL 生成產物。
  代表一個或多個旨在用於 AI 通訊的規範性約束陳述句。

required:
  - statements

properties:

  # =============================================================================
  # CNL 陳述句 (CNL Statements)
  # =============================================================================
  statements:
    type: list
    description: >
      生成的 CNL 陳述句清單。
      每個陳述句使用受控自然語言表達一個規範性約束。

    item:
      type: object
      description: >
        單一 CNL 約束陳述句。

      required:
        - text

      properties:

        # --------------------------------------------------------------------
        # 規範性陳述文本 (Normative Statement Text)
        # --------------------------------------------------------------------
        text:
          type: string
          description: >
            以 CNL 表達的實際規範性約束。
            範例：「報告『必須 (MUST)』包含所有警告的計數。」

        # --------------------------------------------------------------------
        # 規範性關鍵字 (Normative Keyword)
        # --------------------------------------------------------------------
        normative_keyword:
          type: string
          description: >
            陳述句中使用的特定規範性關鍵字（模態詞）。
            用於提高清晰度及後續自動化處理。
          enum:
            - MUST        # 必須
            - MUST NOT    # 不得
            - SHOULD      # 應
            - SHOULD NOT  # 不應

        # --------------------------------------------------------------------
        # 語義提示 (選填 - Semantic Hints)
        # --------------------------------------------------------------------
        # 以下欄位為文本內容提供結構化的分解，以便進行分析，
        # 但不會覆蓋規範性的「text」欄位。
        # --------------------------------------------------------------------

        subject:
          type: string
          description: >
            約束陳述句的選填主體。
            僅作為語義提示，而非可執行邏輯。

        action:
          type: string
          description: >
            描述受約束行為的選填動作動詞。

        target:
          type: string
          description: >
            動作的選填目標。
            用於釐清約束適用於什麼對象。

        condition:
          type: string
          description: >
            約束適用的選填條件。

# ------------------------------------------------------------------------------
# 驗證約束 (Validation Constraints)
# ------------------------------------------------------------------------------
additionalProperties: false
