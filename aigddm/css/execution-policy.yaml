# ----------------------------------------------------------
# CSS Execution Policy
# ----------------------------------------------------------

document:
  type: CSS
  class: C-Class
  version: 1.0

# ----------------------------------------------------------
# Global Rules
# ----------------------------------------------------------

global:
  visibility: ai_read
  executable: false
  include_in_transformation: false

  render_policy:
    omit_section_if_empty: true
    allow_section_reindex: false

# ----------------------------------------------------------
# Section Policies
# ----------------------------------------------------------

sections:

  "0":
    name: Change History
    visibility: human_only
    executable: false
    include_in_transformation: false

  "1":
    name: Introduction
    visibility: ai_read
    executable: false
    include_in_transformation: false

    subsections:
      "1.1":
        name: Purpose
        visibility: ai_read
      "1.2":
        name: Scope
        visibility: ai_read
      "1.3":
        name: Definitions
        visibility: ai_read
      "1.4":
        name: References
        visibility: ai_read
      "1.5":
        name: Document Overview
        visibility: ai_read

  "2":
    name: Structural Elements
    visibility: ai_read
    executable: false
    include_in_transformation: true

    subsections:
      "2.x":
        name: Structural Element
        visibility: ai_read
        executable: false
        include_in_transformation: true

  "3":
    name: Structural Constraints
    visibility: ai_read
    executable: false
    include_in_transformation: false

  "4":
    name: Change Governance
    visibility: ai_read
    executable: false
    include_in_transformation: false

  "A":
    name: Traceability Policy
    visibility: ai_read
    executable: false
    include_in_transformation: false

  "B":
    name: Authoring and Structural Constraints
    visibility: ai_read
    executable: false
    include_in_transformation: false

  "C":
    name: Notes
    visibility: human_only
    executable: false
    include_in_transformation: false
