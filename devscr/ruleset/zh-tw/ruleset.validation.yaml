# ==============================================================================
# devSCR 規則集驗證結構定義 (Ruleset Validation Schema)
# ------------------------------------------------------------------------------
# 定義單一 devSCR 規則集驗證結果的結構。
#
# 目的：
# - 評估規則集的結構品質與正確性
# - 驗證規則引用、適用性清晰度以及治理元數據
#
# 本結構定義：
# - 「不」執行規則
# - 「不」評估規則行為
# - 「不」強制執行治理決策
# - 「不」定義工作流或控制流
#
# 驗證旨在回答：
# 「此規則集作為一個治理分組產物，是否可接受且可用？」
# ==============================================================================

meta:
  schema_id: devSCR-ruleset-validation-schema
  version: "1.0.0"
  status: draft
  description: >
    用於驗證 devSCR 規則集產物的結構定義。
    驗證重點在於結構完整性、引用關係以及治理元數據的適用性。
    「不」評估執行或約束語義。

# ------------------------------------------------------------------------------
# 結構定義 (Schema Definition)
# ------------------------------------------------------------------------------

type: object
description: >
  單一 devSCR 規則集產物的驗證結果。
  此文件報告在規則集驗證期間發現的結構與治理相關問題。

required:
  - target
  - summary
  - findings

properties:

  # --------------------------------------------------------------------------
  # 目標 (Target)
  # --------------------------------------------------------------------------

  target:
    type: object
    description: >
      識別正在被驗證的規則集產物。
    required:
      - ruleset_id
      - ruleset_version
    properties:
      ruleset_id:
        type: string
        description: >
          受驗證規則集的識別碼。

      ruleset_version:
        type: string
        description: >
          受驗證規則集的治理版本。

  # --------------------------------------------------------------------------
  # 摘要 (Summary)
  # --------------------------------------------------------------------------

  summary:
    type: object
    description: >
      聚合的驗證結果。
    required:
      - status
      - issue_count
    properties:
      status:
        type: string
        enum:
          - ok      # 通過
          - warning # 警告
          - failed  # 失敗
        description: >
          整體驗證狀態。

      issue_count:
        type: object
        description: >
          依嚴重程度分類的問題計數。
        required:
          - info
          - warning
          - high
        properties:
          info:          # 資訊
            type: integer
            description: 資訊類發現項目的數量。
          warning:       # 警告
            type: integer
            description: 警告類發現項目的數量。
          high:          # 高風險/錯誤
            type: integer
            description: 高嚴重性發現項目的數量。

  # --------------------------------------------------------------------------
  # 發現結果 (Findings)
  # --------------------------------------------------------------------------

  findings:
    type: list
    description: >
      詳細的驗證發現項目。
    item:
      type: object
      required:
        - id
        - category
        - severity
        - message
      properties:

        id:
          type: string
          description: >
            驗證發現項目的唯一識別碼。

        category:
          type: string
          description: >
            問題分類
            （例如：structure 結構、reference 引用、governance 治理、ambiguity 歧義）。

        location:
          type: string
          description: >
            規則集內發現問題的位置
            （例如：includes[1].rule_id, governance.intent.domain）。

        severity:
          type: string
          enum:
            - info
            - warning
            - high
          description: >
            驗證發現項目的嚴重程度。

        message:
          type: string
          description: >
            問題的易讀描述。

        suggestion:
          type: string
          description: >
            建議的改進或修正方案。

additionalProperties: false
