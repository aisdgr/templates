# ------------------------------------------------------------------------------
# 驗證目標 (Target)
# ------------------------------------------------------------------------------
target:
  ref: "rnl.yaml"

# ------------------------------------------------------------------------------
# 摘要 (Summary)
# ------------------------------------------------------------------------------
summary:
  status: warning
  issue_count:
    info: 1
    warning: 2
    high: 0

# ------------------------------------------------------------------------------
# 發現結果 (Findings)
# ------------------------------------------------------------------------------
findings:
  # ---------------------------------------------------------------------------
  # FND-001 (警告): 歧義性 (Ambiguity)
  # ---------------------------------------------------------------------------
  - id: FND-001
    statement_ref: "statements[1]"
    category: ambiguity
    severity: warning

    message: >
      短語「任何錯誤 (any error)」具有歧義。目前尚不清楚其是指
      解析錯誤、執行階段錯誤、測試失敗，還是外部工具失效。

    rationale:
      模糊的終止條件可能導致行為不一致以及模型漂移。

    suggestion: >
      請將「任何錯誤」替換為明確的錯誤類別，例如「解析錯誤 (parsing error)」、
      「測試失敗 (test failure)」或「工具執行錯誤 (tool execution error)」。

  # ---------------------------------------------------------------------------
  # FND-002 (警告): 範圍缺失 (Scope gap)
  # ---------------------------------------------------------------------------
  - id: FND-002
    statement_ref: "statements[3]"
    category: scope_gap
    severity: warning

    message: >
      規則中引用了「宣告的檔案範圍 (declared file scope)」，但在 RNL 產物中
      並不存在明確的檔案範圍定義。

    rationale:
      檔案邊界約束需要一個明確的範圍錨點；否則
      模型可能會從無關的上下文中推論範圍。

    suggestion: >
      請增加一條定義檔案範圍的 RNL 陳述句，或確保合約中注入了
      具備明確路徑的「FILE_SCOPE」章節。

  # ---------------------------------------------------------------------------
  # FND-003 (資訊): 模式觀察 (Pattern observation)
  # ---------------------------------------------------------------------------
  - id: FND-003
    statement_ref: "statements[0]"
    category: pattern_violation
    severity: info

    message: >
      「報告『必須』計算警告項目的數量。」可能會被解釋為缺少
      目標位置（例如：報告應寫在哪裡）。

    rationale:
      增加明確的目標（例如：「在分析輸出中」）可以提高
      可觀察性與可重複性。

    suggestion: >
      請指定目的地，例如：「報告『必須』在分析輸出報告中計算警告項目的數量。」
