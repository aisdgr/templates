# ==============================================================================
# cnl.validation.yaml
# ID: dev-scr-cnl-validation-schema
# 版本: 1.0.0
# 狀態: 草案 (draft)
# 描述: 
#   用於驗證 RNL 約束陳述句的結構定義。
#   驗證重點在於語言的正確性及其是否適合 AI 使用，
#   而非規範的強制執行。
# ==============================================================================
# 定義 RNL 產物驗證結果的結構。
#
# 目的：
# - 評估 RNL 陳述句的品質與清晰度。
# - 驗證關鍵字用法、模式及結構完整性。
#
# 本結構定義：
# - 「不」施加規範性義務。
# - 「不」定義執行或控制流。
#
# 驗證旨在回答：
# 「此 RNL 陳述句是否格式正確，且對於 AI 處理而言不具歧義？」
# ==============================================================================

# ------------------------------------------------------------------------------
# 結構定義 (Schema Definition)
# ------------------------------------------------------------------------------

type: object
description: >
  RNL 約束產物的驗證結果。
  此文件報告在 RNL 驗證期間發現的結構與語言問題。

required:
  - target
  - summary
  - findings

properties:

  # --------------------------------------------------------------------------
  # 目標 (Target)
  # --------------------------------------------------------------------------
  target:
    type: object
    description: >
      識別正在被驗證的 RNL 產物。
    required:
      - cnl_id
      - cnl_version
    properties:
      cnl_id:
        type: string
        description: >
          受驗證 RNL 產物的識別碼。

      cnl_version:
        type: string
        description: >
          受驗證 RNL 產物的版本。

  # --------------------------------------------------------------------------
  # 摘要 (Summary)
  # --------------------------------------------------------------------------
  summary:
    type: object
    description: >
      聚合的驗證結果。
    required:
      - status
      - issue_count
    properties:
      status:
        type: string
        enum:
          - ok      # 通過
          - warning # 警告
          - failed  # 失敗
        description: >
          RNL 產物的整體驗證狀態。

      issue_count:
        type: object
        description: >
          依嚴重程度分類的問題計數。
        properties:
          info:     # 資訊
            type: integer
          warning:  # 警告
            type: integer
          high:     # 高風險/錯誤
            type: integer

  # --------------------------------------------------------------------------
  # 發現結果 (Findings)
  # --------------------------------------------------------------------------
  findings:
    type: list
    description: >
      針對特定 RNL 陳述句的詳細驗證發現項目。
    item:
      type: object
      required:
        - id
        - category
        - severity
        - message
      properties:
        id:
          type: string
          description: >
            該發現項目的唯一識別碼。

        statement_ref:
          type: string
          description: >
            指向產物中特定陳述句或索引的引用。

        category:
          type: string
          description: >
            問題分類（例如：pattern_violation 模式違反、
            keyword_violation 關鍵字違反、ambiguity 歧義）。

        location:
          type: string
          description: >
            RNL 產物內發現問題的位置。

        severity:
          type: string
          enum:
            - info    # 資訊
            - warning # 警告
            - high    # 高風險/錯誤
          description: >
            驗證發現項目的嚴重程度。

        message:
          type: string
          description: >
            問題的易讀說明。

        suggestion:
          type: string
          description: >
            符合 RNL 模式的建議修正方案。

additionalProperties: false
