# ==============================================================================
# AISDGR – RNL 驗證輸出 (產出物)
# ------------------------------------------------------------------------------
# 目的：
#    AISDGR RNL 產出物的驗證結果。
#
# 注意事項：
#    - 本文件包含描述性發現（事實），而非約束。
#    - AI 可以 (MAY) 取用這些事實進行推理或下一步選擇。
#    - 義務必須 (MUST) 在他處定義（例如：引用此輸出的規則 Rules）。
# ==============================================================================

target:
  ref: "rnl.yaml"

summary:
  status: warning # 警告
  issue_count:
    info: 1
    warning: 2
    high: 0

findings:
  # ---------------------------------------------------------------------------
  # FND-001 (warning): 歧義 (Ambiguity)
  # ---------------------------------------------------------------------------
  - id: FND-001
    statement_ref: "statements[1]"
    category: ambiguity
    severity: warning
    message: >
      短語 "any error"（任何錯誤）具有歧義。目前尚不清楚其是指
      解析錯誤、運行時錯誤、測試失敗，還是外部工具故障。
    rationale: >
      不明確的停止條件可能導致行為不一致和偏離。
    suggestion: >
      將 "any error" 替換為明確的錯誤類別，例如 "parsing error"（解析錯誤）、
      "test failure"（測試失敗）或 "tool execution error"（工具執行錯誤）。

  # ---------------------------------------------------------------------------
  # FND-002 (warning): 範圍缺口 (Scope gap)
  # ---------------------------------------------------------------------------
  - id: FND-002
    statement_ref: "statements[3]"
    category: scope_gap
    severity: warning
    message: >
      引用了 "declared file scope"（宣告的文件範圍），但 RNL 產出物中
      不存在明確的文件範圍定義。
    rationale: >
      文件邊界約束需要一個明確的範圍錨點；否則
      模型可能會從無關的上下文中推斷範圍。
    suggestion: >
      增加一條定義文件範圍的 RNL 陳述，或確保契約（contract）注入一個
      帶有明確路徑的 FILE_SCOPE 區塊。

  # ---------------------------------------------------------------------------
  # FND-003 (info): 模式觀察 (Pattern observation)
  # ---------------------------------------------------------------------------
  - id: FND-003
    statement_ref: "statements[0]"
    category: pattern_violation
    severity: info
    message: >
      "Report MUST count warning entries."（報告必須計算警告分錄）
      可能會被解讀為缺少目標位置（例如：報告寫在哪裡）。
    rationale: >
      增加明確的目標（例如：「在 ANALYSIS OUTPUT 中」）
      可提高可觀測性與可重現性。
    suggestion: >
      指定目的地，例如：「報告必須在分析輸出報告中計算警告分錄。」