# ==============================================================================
# ruleset_example.yaml
# ==============================================================================

ruleset:
  id: DEV-GEN-CODE-JWT-BASELINE

  # ---------------------------------------------------------------------------
  # 包含的規則 (Included Rules)
  # ---------------------------------------------------------------------------
  # 透過識別碼引用個別規則。
  # 規則集「不得」修改或覆蓋規則定義。
  includes:
    - rule_id: GEN-NEW-CODE-ADD-JWT
      version: ">=1.0.0"

    - rule_id: GEN-NEW-CODE-JWT-VALIDATION
      version: ">=1.0.0"

  # ---------------------------------------------------------------------------
  # 適用性 (決策透鏡 - Applicability)
  # ---------------------------------------------------------------------------
  # 描述此規則集相關的決策範圍。
  # 此欄位定義的是「治理透鏡」，而非執行條件。
  applicability:
    domain:                     # 領域
      - backend_development     # 後端開發
      - api_design              # API 設計
    system:                     # 系統
      - authentication_service  # 身份驗證服務
    phase:                      # 階段
      - development             # 開發階段
    artifact:                   # 產物
      - source_code             # 原始碼
      - api_specification       # API 規格書
  # ---------------------------------------------------------------------------
  # 治理 (Governance)
  # ---------------------------------------------------------------------------
  governance:
    version: "1.0.0"
    status: active                 # 啟用
    owner: platform_engineering    # 平台工程團隊

    # -------------------------------------------------------------------------
    # 意圖 (選填 - Intent)
    # -------------------------------------------------------------------------
    # 從治理角度解釋此規則集存在的原因。
    intent:
      domain:                             # 領域
        - identity_and_access_management  # 身份與存取管理
      industry:                           # 行業
        - fintech                         # 金融科技
      regulation_reference:               # 法規引用
        - ISO_27001
        - ISO_42001
      policy_category:                    # 政策類別
        - secure_code_generation          # 安全程式碼生成
    # -------------------------------------------------------------------------
    # 職責 (Responsibilities)
    # -------------------------------------------------------------------------
    # 宣告與此規則集相關的治理層級問責制度。
    responsibilities:
      ai:                             # 人工智慧
        - code_generator              # 程式碼生成器
      human:                          # 人員
        - tech_lead                   # 技術主管
        - security_reviewer           # 安全審核員
      system:                         # 系統
        - policy_auditor              # 政策審計員
      committee:                      # 委員會
        - security_architecture_board # 安全架構委員會
    # -------------------------------------------------------------------------
    # 治理影響 (Governance Impact)
    # -------------------------------------------------------------------------
    # 採用此規則集在治理層級的描述性影響。
    governance_impact:
      audit_scope:              # 審計範圍
        - generated_source_code # 生成的原始碼
        - authentication_logic  # 身份驗證邏輯
      reporting:                # 報告內容
        - jwt_usage_summary     # JWT 使用摘要
        - missing_claim_report  # 缺失聲明報告
      risk_category:            # 風險類別
        - authentication        # 身份驗證
        - authorization         # 授權
