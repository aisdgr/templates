# ==============================================================================
# ruleset.schema.yaml
# ID: dev-scr-ruleset-schema
# 版本: 1.0.0
# 狀態: 草案 (draft)
# 描述: 
#   用於將規則分組為治理集合的概念性結構定義。
#   規則集（Rulesets）組織規則引用，以便進行適用性分析與解釋。
#   其含義與強制執行由外部治理政策定義。
# ==============================================================================
# 概念性規則集結構定義 (Conceptual Ruleset Schema)
#
# 此結構定義了將多條規則組織為「以決策為導向」之約束集合的結構邊界。
#
# 設計原則：
# - 規則集「不得」定義任何規範性約束或行為。
# - 規則集僅透過識別碼引用現有規則。
# - 規則集代表一種治理視角，而非執行邏輯。
# - 所有政策與領域語義皆為描述性質且不可執行。
# ==============================================================================

# ------------------------------------------------------------------------------
# 結構根節點 (Schema Root)
# ------------------------------------------------------------------------------
type: object
description: >
  宣告式規則集定義。
  規則集是一種治理產物，它在共享的決策視角下對多條規則進行分組與情境化。
  本結構僅定義結構。

required:
  - ruleset

properties:

  # =============================================================================
  # 規則集 (Ruleset)
  # =============================================================================
  ruleset:
    type: object
    description: >
      規則集定義了一組規則引用，及其共享的適用性與治理背景。
      規則集「不得」引入新的約束。

    required:
      - id
      - governance
      - includes

    properties:

      # -------------------------------------------------------------------------
      # 規則集識別碼 (Ruleset Identifier)
      # -------------------------------------------------------------------------
      id:
        type: string
        description: >
          規則集的唯一識別碼。
          用於引用、版本控制、可追溯性以及治理討論。

      # -------------------------------------------------------------------------
      # 包含項 (規則引用 - Includes)
      # -------------------------------------------------------------------------
      includes:
        type: list
        description: >
          包含在此規則集中的規則引用清單。
          規則僅透過識別碼引用。
          規則集「不得」覆蓋或修改規則定義。

        item:
          type: object
          required:
            - rule_id
          properties:
            rule_id:
              type: string
              description: >
                所引用規則的識別碼。
            version:
              type: string
              description: >
                所引用規則的選填版本約束。

      # -------------------------------------------------------------------------
      # 適用性 (決策透鏡 - Applicability)
      # -------------------------------------------------------------------------
      applicability:
        type: map
        description: >
          宣告此規則集適用的決策範圍。
          此欄位定義的是「治理透鏡 (Governance Lens)」，而非執行條件、
          觸發器或控制流語義。

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                企業定義的適用性屬性。
                鍵 (Key) 與值 (Value) 皆可完全自定義。
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

      # -------------------------------------------------------------------------
      # 治理 (Governance)
      # -------------------------------------------------------------------------
      governance:
        type: object
        description: >
          與規則集相關聯的治理元數據。
          治理資訊是描述性的，且「不得」影響執行行為。

        required:
          - version
          - status
          - owner

        properties:

          # ---------------------------------------------------------------------
          # 治理版本 (Governance Version)
          # ---------------------------------------------------------------------
          version:
            type: string
            description: >
              此規則集之治理定義的版本。
              用於可審計性與生命週期追踪。

          # ---------------------------------------------------------------------
          # 治理狀態 (Governance Status)
          # ---------------------------------------------------------------------
          status:
            type: string
            description: >
              規則集當前的治理狀態（例如：啟用 active、草案 draft、已棄用 deprecated）。

          # ---------------------------------------------------------------------
          # 治理所有者 (Governance Owner)
          # ---------------------------------------------------------------------
          owner:
            type: string
            description: >
              負責管理此規則集的組織或權責單位。

          # ---------------------------------------------------------------------
          # 意圖 (選填治理註解 - Intent)
          # ---------------------------------------------------------------------
          intent:
            type: map
            description: >
              選填的治理註解，描述規則集存在的原因。
              意圖僅供參考且非規範性。
              它「不得」引入執行邏輯。

            value:
              oneOf:
                - type: string
                - type: list
                  item:
                    type: string
                - type: object
                  description: >
                    組織定義的意圖屬性。
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: list
                        item:
                          type: string

          # ---------------------------------------------------------------------
          # 職責 (Responsibilities)
          # ---------------------------------------------------------------------
          responsibilities:
            type: map
            description: >
              宣告與規則集相關的利害關係人之問責制度。
              職責「不會」影響執行行為。

            value:
              type: object
              additionalProperties:
                type: list
                item:
                  type: string

          # ---------------------------------------------------------------------
          # 治理影響 (Governance Impact)
          # ---------------------------------------------------------------------
          governance_impact:
            type: map
            description: >
              治理層級對結果與影響的解釋。
              此欄位為描述性質且不可執行。

            value:
              oneOf:
                - type: string
                - type: list
                  item:
                    type: string
                - type: object
                  description: >
                    組織定義的影響屬性。
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: list
                        item:
                          type: string

# ------------------------------------------------------------------------------
# 驗證約束 (Validation Constraints)
# ------------------------------------------------------------------------------
additionalProperties: false
