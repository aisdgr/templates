# ==============================================================================
# rule.schema.yaml
# ==============================================================================
# 概念性規則結構定義 (Conceptual Rule Schema)
#
# 此結構定義了表達具備治理意識之約束規則的結構邊界。
#
# 設計原則：
# - normative 是唯一的規範性約束表示方式。
# - 所有其他欄位皆為描述性質且不可執行。
# - 治理資訊「不得」影響執行行為。
# - 本結構僅定義結構與允許的形式，而非政策意義或行為語義。
# ==============================================================================

# ------------------------------------------------------------------------------
# 元數據 (Metadata)
# ------------------------------------------------------------------------------
# ID: dev-scr-rule-schema
# 版本: 1.0.0
# 狀態: 草案 (draft)
# 描述: 
#   用於宣告式治理規則的概念性結構定義。
#   本結構僅定義形式與邊界。
#   規則意義與執行方式由本結構之外的規則集與治理政策定義。
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 結構根節點 (Schema Root)
# ------------------------------------------------------------------------------
type: object
description: >
  宣告式規則定義。
  規則是以結構化自然語言表達的治理產物。
  本結構僅定義其結構。
  所有語義均在結構之外定義。

required:
  - execution
  - governance

properties:

  # =============================================================================
  # 執行 (Execution)
  # =============================================================================
  execution:
    type: object
    description: >
      規則的執行背景，包含其識別碼、解釋觀點及規範性約束。
      一條規則「必須」僅包含一個規範性陳述。

    required:
      - id
      - apply_as
      - normative

    properties:

      # -------------------------------------------------------------------------
      # 規則識別碼 (Rule Identifier)
      # -------------------------------------------------------------------------
      id:
        type: string
        description: >
          規則的唯一識別碼。
          此識別碼用於引用、版本控制、可追溯性以及治理討論。

      # -------------------------------------------------------------------------
      # 套用為 (Apply As)
      # -------------------------------------------------------------------------
      apply_as:
        type: string
        description: >
          指定 LLM 在解釋和套用規範性陳述時「必須」採用的專業觀點。
          這是一個語義邊界，將 LLM 的解釋空間縮小至特定的領域視角。
          這不是角色扮演人物設定，也不是責任分配。

      # -------------------------------------------------------------------------
      # 規範 (規範性核心 - Normative)
      # -------------------------------------------------------------------------
      normative:
        type: string
        description: >
          以規則規範語言 (RNL) 表達的唯一規範性陳述。
          這是「唯一」可以包含強制性或禁止性用語（如 必須、不得、應 或 不應）的欄位。
          所有約束行為「必須」源自於此欄位。

  # =============================================================================
  # 治理 (Governance)
  # =============================================================================
  governance:
    type: object
    description: >
      與規則相關聯的治理元數據。
      治理資訊是描述性的，且「不得」參與約束執行或控制流。

    required:
      - version
      - status
      - owner

    properties:

      # -------------------------------------------------------------------------
      # 治理版本 (Governance Version)
      # -------------------------------------------------------------------------
      version:
        type: string
        description: >
          此規則之治理定義的版本。
          用於審計性與生命週期追踪。

      # -------------------------------------------------------------------------
      # 治理狀態 (Governance Status)
      # -------------------------------------------------------------------------
      status:
        type: string
        description: >
          規則當前的治理狀態（例如：啟用 active、已棄用 deprecated、草案 draft）。

      # -------------------------------------------------------------------------
      # 治理所有者 (Governance Owner)
      # -------------------------------------------------------------------------
      owner:
        type: string
        description: >
          負責治理此規則的組織或權責單位。

      # -------------------------------------------------------------------------
      # 意圖 (選填治理註解 - Intent)
      # -------------------------------------------------------------------------
      intent:
        type: map
        description: >
          選填的治理註解，描述規則存在的原因。
          意圖僅供參考且非規範性。
          它「不得」引入條件、執行邏輯或風險評估。

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                組織定義的意圖屬性。
                用於合理解釋、政策對齊或治理說明。
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

      # -------------------------------------------------------------------------
      # 職責 (Responsibilities)
      # -------------------------------------------------------------------------
      responsibilities:
        type: map
        description: >
          宣告與規則相關的利害關係人問責關係。
          職責「不會」影響執行行為，也不暗示控制權限。

        value:
          type: object
          additionalProperties:
            type: list
            item:
              type: string

      # -------------------------------------------------------------------------
      # 適用背景 (Applicability Context)
      # -------------------------------------------------------------------------
      applicability_context:
        type: map
        description: >
          用於治理詮釋的描述性背景。
          此欄位從治理角度描述規則在「何時」具有相關性。
          它「不得」被解釋為條件或觸發器。

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                組織定義的背景屬性。
                用於風險描述、場景或分類。
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

      # -------------------------------------------------------------------------
      # 治理影響 (Governance Impact)
      # -------------------------------------------------------------------------
      governance_impact:
        type: map
        description: >
          對結果、影響及證據預期的治理層級解釋。
          此欄位為描述性質且不可執行。
          它「不得」被解釋為動作或指令。

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                組織定義的影響屬性，
                例如分類、報告預期或審計含義。
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

# ------------------------------------------------------------------------------
# 驗證約束 (Validation Constraints)
# ------------------------------------------------------------------------------
additionalProperties: false
