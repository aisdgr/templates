# ==============================================================================
# rule_example.yaml
# ==============================================================================

execution:
  id: GEN-NEW-CODE-ADD-JWT

  # ---------------------------------------------------------------------------
  # 套用為 (Apply As)
  # ---------------------------------------------------------------------------
  # 大型語言模型 (LLM) 生成程式碼時所「必須」採用的專業觀點。
  apply_as: security_engineer

  # ---------------------------------------------------------------------------
  # 規範 (規範性核心 - Normative)
  # ---------------------------------------------------------------------------
  # 本規則中唯一的規範性聲明。
  normative: >
    當建立新的受保護 API 端點時，生成的程式碼「必須」包含基於 JWT 的身份驗證。

# ---------------------------------------------------------------------------
# 治理 (Governance)
# ---------------------------------------------------------------------------
governance:
  version: "1.0.0"
  status: active                # 啟用
  owner: platform_security_team # 平台安全團隊

  # -------------------------------------------------------------------------
  # 意圖 (選填 - Intent)
  # -------------------------------------------------------------------------
  intent:
    rationale:                            # 基本原理
      - establish_authentication_baseline # 建立身份驗證基準
      - prevent_unauthorized_access       # 防止未經授權的存取
    alignment:                            # 對齊目標
      - security_by_default               # 預設安全

  # -------------------------------------------------------------------------
  # 職責 (Responsibilities)
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - code_generator               # 程式碼生成器
    human:                           # 人員
      - security_reviewer            # 安全審核員
      - backend_maintainer           # 後端維護者
    system:                          # 系統
      - compliance_auditor           # 合規審計員
    policy_reference:                # 政策引用
      - SEC-JWT-GENERATION-BASELINE

  # -------------------------------------------------------------------------
  # 適用背景 (Applicability Context)
  # -------------------------------------------------------------------------
  # 描述性的治理背景（何時 / 情境），非執行條件。
  applicability_context:
    scenario:                               # 場景
      introducing_protected_api:            # 引入受保護的 API
        risk: security                      # 安全風險
        severity: high                      # 高嚴重度
        reason:                             # 原因
          - unauthenticated_endpoint_risk   # 未經驗證的端點風險
          - token_misconfiguration_risk     # 權杖設定錯誤風險
    environment:                            # 環境
      - backend_service                     # 後端服務
      - public_api                          # 公開 API

  # -------------------------------------------------------------------------
  # 治理影響 (Governance Impact)
  # -------------------------------------------------------------------------
  # 治理層級對結果的解釋以及對於證據的預期。
  governance_impact:
    outcome:                                  # 結果
      classification: authentication_required # 要求身份驗證
    evidence_expected:                        # 預期證據
      - jwt_validation_present                # 包含 JWT 驗證邏輯
      - token_expiration_configured           # 已配置權杖過期時間
      - authorization_claims_checked          # 已檢查授權聲明
    audit_focus:                              # 審計重點
      - jwt_library_selection                 # JWT 函式庫選擇
      - secret_key_management                 # 密鑰管理