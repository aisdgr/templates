# ==============================================================================
# rule.schema.yaml
# ID: dev-scr-rule-schema
# Version: 1.0.0
# Status: draft
# Description: 
#   Conceptual structural schema for declarative governance rules.
#   This schema defines form and boundaries only.
#   Rule meaning and enforcement are defined by rulesets
#   and governance policy outside this schema. 
# ==============================================================================
# Conceptual Rule Schema
#
# This schema defines the structural boundaries for expressing
# governance-aware constraint rules.
#
# Design Principles:
# - normative is the ONLY normative constraint representation.
# - All other fields are descriptive and non-executable.
# - Governance information MUST NOT influence execution behavior.
# - This schema defines structure and allowed form only,
#   not policy meaning or behavioral semantics.
# ==============================================================================

# ------------------------------------------------------------------------------
# Schema Root
# ------------------------------------------------------------------------------
type: object
description: >
  Declarative rule definition.
  A rule is a governance artifact expressed in structured
  natural language. The schema defines structure only.
  All semantics are defined outside this schema.

required:
  - execution
  - governance

properties:

  # =============================================================================
  # Execution
  # =============================================================================
  execution:
    type: object
    description: >
      Execution context of the rule, including its identifier,
      interpretation viewpoint, and normative constraint.
      A rule MUST contain exactly one normative statement.

    required:
      - id
      - apply_as
      - normative

    properties:

      # -------------------------------------------------------------------------
      # Rule Identifier
      # -------------------------------------------------------------------------
      id:
        type: string
        description: >
          Unique identifier of the rule.
          The identifier is used for reference, versioning,
          traceability, and governance discussions.

      # -------------------------------------------------------------------------
      # Apply As
      # -------------------------------------------------------------------------
      apply_as:
        type: string
        description: >
          Specifies the professional perspective the LLM MUST adopt
          when interpreting and applying the normative statement.
          This is a semantic boundary that narrows the LLM's
          interpretation space to a specific domain lens.
          It is NOT a role-playing persona
          and NOT a responsibility assignment.

      # -------------------------------------------------------------------------
      # Normative (Normative Core)
      # -------------------------------------------------------------------------
      normative:
        type: string
        description: >
          The sole normative statement expressed in Rule Normative Language (RNL).
          This is the ONLY field that may contain mandatory or prohibitive language
          such as MUST, MUST NOT, SHALL, or SHALL NOT.
          All constraint behavior MUST be derived from this field.

  # =============================================================================
  # Governance
  # =============================================================================
  governance:
    type: object
    description: >
      Governance metadata associated with the rule.
      Governance information is descriptive and MUST NOT
      participate in constraint execution or control flow.

    required:
      - version
      - status
      - owner

    properties:

      # -------------------------------------------------------------------------
      # Governance Version
      # -------------------------------------------------------------------------
      version:
        type: string
        description: >
          Version of the governance definition for this rule.
          Used for auditability and lifecycle tracking.

      # -------------------------------------------------------------------------
      # Governance Status
      # -------------------------------------------------------------------------
      status:
        type: string
        description: >
          Current governance status of the rule
          (e.g., active, deprecated, draft).

      # -------------------------------------------------------------------------
      # Governance Owner
      # -------------------------------------------------------------------------
      owner:
        type: string
        description: >
          Organization or authority responsible
          for governing this rule.

      # -------------------------------------------------------------------------
      # Intent (Optional Governance Annotation)
      # -------------------------------------------------------------------------
      intent:
        type: map
        description: >
          Optional governance annotation describing
          why the rule exists.
          Intent is informational and non-normative.
          It MUST NOT introduce conditions,
          execution logic, or risk evaluation.

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                Organization-defined intent attributes.
                Used for rationale, policy alignment,
                or governance explanation.
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

      # -------------------------------------------------------------------------
      # Responsibilities
      # -------------------------------------------------------------------------
      responsibilities:
        type: map
        description: >
          Declares accountability of stakeholders
          related to the rule.
          Responsibilities do NOT affect execution behavior
          and do NOT imply control authority.

        value:
          type: object
          additionalProperties:
            type: list
            item:
              type: string

      # -------------------------------------------------------------------------
      # Applicability Context
      # -------------------------------------------------------------------------
      applicability_context:
        type: map
        description: >
          Descriptive context used for governance interpretation.
          This field describes WHEN the rule is relevant
          from a governance perspective.
          It MUST NOT be interpreted as a condition or trigger.

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                Organization-defined contextual attributes.
                Used for risk description, scenarios,
                or classification.
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

      # -------------------------------------------------------------------------
      # Governance Impact
      # -------------------------------------------------------------------------
      governance_impact:
        type: map
        description: >
          Governance-level interpretation of outcomes,
          implications, and evidence expectations.
          This field is descriptive and non-executable.
          It MUST NOT be interpreted as an action or instruction.

        value:
          oneOf:
            - type: string
            - type: list
              item:
                type: string
            - type: object
              description: >
                Organization-defined impact attributes,
                such as classifications, reporting expectations,
                or audit implications.
              additionalProperties:
                oneOf:
                  - type: string
                  - type: list
                    item:
                      type: string

# ------------------------------------------------------------------------------
# Validation Constraints
# ------------------------------------------------------------------------------
additionalProperties: false
