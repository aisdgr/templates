# ==============================================================================
# rule.validation.yaml
# ID: dev-scr-rule-validation-schema
# Version: 1.0.0
# Status: draft
# Description: 
#   Structural schema for validating rule artifacts.
#   Validation focuses on rule correctness and suitability
#   for AI communication, not execution outcome.
# ==============================================================================
# Defines the structure of a validation result for a single rule.
#
# Purpose:
# - Evaluate rule quality and correctness
# - Validate structure, language (RNL), and semantic usability
#
# This schema:
# - DOES NOT execute rules
# - DOES NOT enforce governance decisions
# - DOES NOT define workflows or control flow
#
# Validation answers:
# "Is this rule, as an AI constraint artifact, acceptable and usable?"
# ==============================================================================

# ------------------------------------------------------------------------------
# Schema Definition
# ------------------------------------------------------------------------------

type: object
description: >
  Validation result for a single rule artifact.
  This document reports structural and semantic issues found
  during rule validation.

required:
  - target
  - summary
  - findings

properties:

  # --------------------------------------------------------------------------
  # Target
  # --------------------------------------------------------------------------

  target:
    type: object
    description: >
      Identifies the rule artifact being validated.
    required:
      - rule_id
      - rule_version
    properties:
      rule_id:
        type: string
        description: >
          Identifier of the validated rule.

      rule_version:
        type: string
        description: >
          Version of the validated rule.

  # --------------------------------------------------------------------------
  # Summary
  # --------------------------------------------------------------------------

  summary:
    type: object
    description: >
      Aggregated validation outcome.
        - human
        - ai
    required:
      - status
      - issue_count
    properties:
      status:
        type: string
        enum:
          - ok
          - warning
          - failed
        description: >
          Overall validation status.
            - human

      issue_count:
        type: object
        description: >
          Count of findings by severity.
        properties:
          info:
            type: integer
          warning:
            type: integer
          high:
            type: integer

  # --------------------------------------------------------------------------
  # Findings
  # --------------------------------------------------------------------------

  findings:
    type: list
    description: >
      Detailed validation findings.
    item:
      type: object
      required:
        - id
        - category
        - severity
        - message
      properties:
        id:
          type: string
          description: >
            Unique identifier of the finding.

        category:
          type: string
          description: >
            Classification of the issue
            (e.g. structure, rnl_violation, ambiguity).

        location:
          type: string
          description: >
            Location within the rule where the issue was found
            (e.g. description, applies_to.section).

        severity:
          type: string
          enum:
            - info
            - warning
            - high
          description: >
            Severity of the validation finding.

        message:
          type: string
          description: >
            Human-readable description of the issue.

        suggestion:
          type: string
          description: >
            Suggested improvement or correction.

additionalProperties: false
