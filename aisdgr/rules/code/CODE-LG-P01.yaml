# ==============================================================================
# CODE-LG-P01.yaml
# Each execution MUST produce a locatable execution record.
# ==============================================================================

execution:
  id: CODE-LG-P01
  apply_as: logging_engineer
  normative: >
    Each code execution MUST produce
    a locatable execution record.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - ensure_execution_observability
      - prevent_untraceable_execution
      - enable_post_execution_audit

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - code_executor
    system:
      - execution_logger
      - record_locator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - develop
    scope:
      - code_execution
    risk:
      - auditability
      - governance
    severity:
      - medium
    reason:
      - missing_execution_record
      - non_locatable_record

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: enforce
    affected_capabilities:
      - execution_traceability
      - auditability
      - accountability
