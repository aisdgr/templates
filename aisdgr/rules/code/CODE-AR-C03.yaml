# ==============================================================================
# CODE-AR-C03.yaml
# Code execution MUST NOT modify multiple artifact types simultaneously.
# ==============================================================================

execution:
  id: CODE-AR-C03
  apply_as: artifact_engineer
  normative: >
    Code execution MUST NOT modify artifacts
    belonging to more than one artifact type
    within a single execution.

governance:
  version: "1.0.0"
  status: draft
  owner: asdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - prevent_cross_artifact_contamination
      - enforce_single_artifact_focus

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - code_executor
    system:
      - artifact_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - develop
    scope:
      - artifact_modification
    reason:
      - multiple_artifact_types_modified
      - artifact_isolation_violation

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - artifact_isolation
      - execution_safety
      - auditability
