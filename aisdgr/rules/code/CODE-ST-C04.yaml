# ==============================================================================
# CODE-ST-C04.yaml
# Removal of existing behavior is forbidden unless explicitly allowed.
# ==============================================================================

execution:
  id: CODE-ST-C04
  apply_as: structure_engineer
  normative: >
    Code execution MUST NOT remove existing behavior
    unless explicit permission for behavior removal
    has been declared.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - prevent_silent_behavior_removal
      - preserve_backward_compatibility
      - enforce_explicit_deprecation_intent

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - code_executor
    system:
      - behavior_validator
      - structure_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - develop
    scope:
      - behavior_removal
    risk:
      - architecture
      - correctness
    severity:
      - high
    reason:
      - unauthorized_behavior_removal
      - backward_compatibility_risk

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - behavioral_integrity
      - backward_compatibility
      - auditability
