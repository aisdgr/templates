# ==============================================================================
# CODE-AR-C02.yaml
# Modification of undeclared artifact types is forbidden.
# ==============================================================================

execution:
  id: CODE-AR-C02
  apply_as: artifact_engineer
  normative: >
    Code execution MUST NOT modify any artifact
    whose artifact type is not explicitly declared.

governance:
  version: "1.0.0"
  status: draft
  owner: asdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - prevent_implicit_artifact_modification
      - enforce_artifact_type_control

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - code_executor
    system:
      - artifact_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - develop
    scope:
      - artifact_modification
    reason:
      - undeclared_artifact_type
      - artifact_type_violation

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - artifact_isolation
      - execution_safety
      - auditability
