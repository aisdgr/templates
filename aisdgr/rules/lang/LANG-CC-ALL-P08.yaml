# ==============================================================================
# LANG-CC-ALL-P08.yaml
# Explicit Error Handling
# Source: CCS-STD-006
# ==============================================================================

execution:
  id: LANG-CC-ALL-P08
  apply_as: code_engineer
  normative: >
    Errors MUST be handled explicitly and MUST NOT be silently ignored.
    All failure paths MUST be visible and reviewable.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - prevent_silent_failures
      - all_failure_paths_visible

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - code_generator
    human:
      - code_reviewer
    system:
      - error_flow_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - code_generation
    scope:
      - all_languages
    language:
      - all
    risk:
      - silent_failure
      - masked_error
    severity:
      - high
    reason:
      - error_transparency

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - error_traceability
      - reliability
