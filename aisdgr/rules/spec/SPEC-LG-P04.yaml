# ==============================================================================
# SPEC-LG-P04.yaml
# A change summary MUST be provided.
# ==============================================================================

execution:
  id: SPEC-LG-P04
  apply_as: logging_engineer
  normative: >
    Each spec generation execution that results in changes
    MUST include a change summary.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - preserve_change_intent
      - enable_review_and_audit

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - spec_executor
    system:
      - change_summarizer

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - design
    scope:
      - document_change
    risk:
      - traceability
    severity:
      - medium
    reason:
      - missing_change_summary

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: enforce
    affected_capabilities:
      - auditability
      - reviewability
