# ==============================================================================
# SPEC-CC-C07.yaml
# Appendix Generation Constraint
# Pattern: GGC — Generation Governance
# ==============================================================================

execution:
  id: SPEC-CC-C07
  apply_as: content_regulator
  normative: >
    AI MUST NOT generate appendix content by default. Appendix generation
    MUST require explicit human instruction.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - appendix_generation_requires_explicit_instruction
      - restrict_ai_content_generation

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - spec_generator
    human:
      - generation_supervisor
    system:
      - generation_governor

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - specify
    scope:
      - content_generation
    document_type:
      - cas
      - cis
      - css
      - sds
      - srs
      - sts
    risk:
      - unauthorized_generation
    severity:
      - high
    reason:
      - generation_boundary_violation

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - generation_safety
      - content_governance
