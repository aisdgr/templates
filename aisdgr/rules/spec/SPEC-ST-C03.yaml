# ==============================================================================
# SPEC-ST-C03.yaml
# Introduction of new sections, requirements, or acceptance criteria not defined in the template is forbidden unless explicitly allowed.
# ==============================================================================

execution:
  id: SPEC-ST-C03
  apply_as: structure_engineer
  normative: >
    Code execution MUST NOT introduce new sections, requirements, or acceptance criteria not defined in the template
    unless explicit permission for new sections, requirements, or acceptance criteria not defined in the template
    has been declared.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - prevent_feature_creep
      - block_implicit_requirement_expansion
      - enforce_functional_scope_control

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - spec_executor
    system:
      - structure_validator
      - behavior_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - design
    scope:
      - requirement_introduction
    risk:
      - architecture
      - correctness
    severity:
      - high
    reason:
      - unauthorized_new_functionality
      - implicit_requirement_expansion

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - functional_scope_control
      - architectural_stability
      - auditability
