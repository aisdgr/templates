# ==============================================================================
# SPEC-ST-C02.yaml
# Structural refactoring and logic changes MUST NOT occur together.
# ==============================================================================

execution:
  id: SPEC-ST-C02
  apply_as: structure_engineer
  normative: >
    Code execution MUST NOT perform modification of template-defined section structure
    and logic changes within the same execution.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - prevent_semantic_smuggling
      - isolate_structural_change_from_behavior
      - reduce_inference_creep

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - spec_executor
    system:
      - structure_validator
      - behavior_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - design
    scope:
      - section_structure_change
      - content_modification
    risk:
      - architecture
      - correctness
    severity:
      - high
    reason:
      - mixed_structural_and_logic_change
      - semantic_drift_risk

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - architectural_stability
      - behavioral_integrity
      - auditability
