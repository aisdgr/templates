# ==============================================================================
# SPEC-CC-C01.yaml
# Informative Section Constraint
# Pattern: GEC — Section Authority
# section_type: informative
# ==============================================================================

execution:
  id: SPEC-CC-C01
  apply_as: content_engineer
  normative: >
    Sections classified as informative MUST be descriptive only and
    MUST NOT define requirements, constraints, normative behavior,
    or authoritative content for the document type.

governance:
  version: "1.0.0"
  status: draft
  owner: aisdgr

  # -------------------------------------------------------------------------
  # Intent
  # -------------------------------------------------------------------------
  intent:
    rationale:
      - informative_section_is_descriptive_only
      - enforce_content_boundary

  # -------------------------------------------------------------------------
  # Responsibilities
  # -------------------------------------------------------------------------
  responsibilities:
    ai:
      - spec_generator
    human:
      - document_author
    system:
      - content_validator

  # -------------------------------------------------------------------------
  # Applicability Context
  # -------------------------------------------------------------------------
  applicability_context:
    stage:
      - specify
    scope:
      - content_authoring
    section_type:
      - informative
    document_type:
      - cas
      - cis
      - css
      - sds
      - srs
      - sts
    risk:
      - content_violation
    severity:
      - medium
    reason:
      - section_content_boundary

  # -------------------------------------------------------------------------
  # Governance Impact
  # -------------------------------------------------------------------------
  governance_impact:
    level: blocking
    affected_capabilities:
      - content_integrity
      - document_conformance
