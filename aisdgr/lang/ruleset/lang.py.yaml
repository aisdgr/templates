# ==============================================================================
# lang.py.yaml
#
# Ruleset Role:
#   This ruleset defines Python-specific coding standards by composing
#   language-agnostic core standards (LANG-STD) with Python-specific rules.
#
# Execution Semantics:
#   - Explicitness over cleverness or implicit features
#   - Explicit exception handling with specific types
#   - Type hints for public apis
#   - Explicit boundary input validation
#   - Deterministic core logic with explicit randomness control
#   - Intent-revealing comments and docstrings
#
# Governance Semantics:
#   - Python projects must comply with both core and Python-specific standards
#   - This ruleset automatically includes all LANG-STD core rules
#   - Violations of Constraints trigger governance enforcement
#   - Violations of Policies require documented justification
#
# Design Notes:
#   - Individual rules are atomic and reusable
#   - Quality semantics are expressed ONLY at the ruleset level
#   - Rulesets select and compose rules; they never redefine rule behavior
#
# ==============================================================================

ruleset:
  id: lang.py
  includes:
  - rule_id: LANG-STD-C-01
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-02
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-03
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-04
    version: '>=1.0.0'
  - rule_id: LANG-STD-P-01
    version: '>=1.0.0'
  - rule_id: LANG-STD-P-02
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-05
    version: '>=1.0.0'
  - rule_id: LANG-PY-C-01
    version: '>=1.0.0'
  - rule_id: LANG-PY-C-02
    version: '>=1.0.0'
  - rule_id: LANG-PY-P-01
    version: '>=1.0.0'
  - rule_id: LANG-PY-P-02
    version: '>=1.0.0'
  - rule_id: LANG-PY-C-03
    version: '>=1.0.0'
  - rule_id: LANG-PY-P-03
    version: '>=1.0.0'
  applicability:
    domain:
    - code
    artifact:
    - source_code
    language:
    - python
    stage:
    - develop
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    intent:
      purpose:
      - python_specific_quality
      - language_standards
      notes:
      - This ruleset composes LANG-STD and LANG-PYTHON rules for Python projects.
      - 'Includes 13 rules: core standards + Python-specific standards.'
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
      system:
      - validator
    governance_impact:
      audit_scope:
      - code_quality
      - language_standards
      - python_standards
      reporting:
      - rule_evaluation_report
      risk_category:
      - type_safety
      - explicitness
      - error_handling
