# ==============================================================================
# lang.java.yaml
#
# Ruleset Role:
#   This ruleset defines Java-specific coding standards by composing
#   language-agnostic core standards (LANG-STD) with Java-specific rules.
#
# Execution Semantics:
#   - Type safety and explicit typing
#   - Null handling with optional or explicit checks
#   - Controlled inheritance with limited depth
#   - Judicious use of checked exceptions
#   - Immutable data structures for thread safety
#   - Intent-revealing identifiers and documentation
#
# Governance Semantics:
#   - Java projects must comply with both core and Java-specific standards
#   - This ruleset automatically includes all LANG-STD core rules
#   - Violations of Constraints trigger governance enforcement
#   - Violations of Policies require documented justification
#
# Design Notes:
#   - Individual rules are atomic and reusable
#   - Quality semantics are expressed ONLY at the ruleset level
#   - Rulesets select and compose rules; they never redefine rule behavior
#
# ==============================================================================

ruleset:
  id: lang.java
  includes:
  - rule_id: LANG-STD-C-01
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-02
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-03
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-04
    version: '>=1.0.0'
  - rule_id: LANG-STD-P-01
    version: '>=1.0.0'
  - rule_id: LANG-STD-P-02
    version: '>=1.0.0'
  - rule_id: LANG-STD-C-05
    version: '>=1.0.0'
  - rule_id: LANG-JAVA-C-01
    version: '>=1.0.0'
  - rule_id: LANG-JAVA-P-01
    version: '>=1.0.0'
  - rule_id: LANG-JAVA-C-02
    version: '>=1.0.0'
  - rule_id: LANG-JAVA-P-02
    version: '>=1.0.0'
  - rule_id: LANG-JAVA-P-03
    version: '>=1.0.0'
  - rule_id: LANG-JAVA-P-04
    version: '>=1.0.0'
  applicability:
    domain:
    - code
    artifact:
    - source_code
    language:
    - java
    stage:
    - develop
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    intent:
      purpose:
      - java_specific_quality
      - language_standards
      notes:
      - This ruleset composes LANG-STD and LANG-JAVA rules for Java projects.
      - 'Includes 13 rules: core standards + Java-specific standards.'
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
      system:
      - validator
    governance_impact:
      audit_scope:
      - code_quality
      - language_standards
      - java_standards
      reporting:
      - rule_evaluation_report
      risk_category:
      - type_safety
      - explicitness
      - error_handling
