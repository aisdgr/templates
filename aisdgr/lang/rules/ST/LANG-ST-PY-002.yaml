# ==============================================================================
# LANG-PY-C-02.yaml
# Explicit exception handling
# ==============================================================================

rule:
  id: LANG-ST-PY-002
  execution_view: python_engineer
  constraint: 'Exceptions MUST be handled explicitly.

    Broad exception handling (e.g., bare `except`)

    MUST NOT be used unless fully justified and documented.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Python
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-PY-002
    intent:
      rationale:
      - Prevent hidden control flow and masked failures.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
