# ==============================================================================
# LANG-TS-C-02.yaml
# Explicit type annotations for public APIs
# ==============================================================================

rule:
  id: LANG-ST-TS-002
  execution_view: typescript_engineer
  constraint: 'Public functions, methods, and exported values

    MUST have explicit type annotations.

    Inferred types MUST NOT be relied upon for public contracts.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - TypeScript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-TS-002
    intent:
      rationale:
      - Treat public type definitions as stable contracts.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
