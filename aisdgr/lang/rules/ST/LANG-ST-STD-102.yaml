# ==============================================================================
# LANG-STD-P-02.yaml
# Boundary validation and error visibility
# ==============================================================================

rule:
  id: LANG-ST-STD-102
  execution_view: code_quality_engineer
  constraint: 'Inputs at system boundaries SHOULD be validated explicitly.

    Errors SHOULD surface clearly and MUST NOT be silently ignored.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages: []
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-STD-006
    intent:
      rationale:
      - Prevent silent failures and undefined behavior propagation.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
