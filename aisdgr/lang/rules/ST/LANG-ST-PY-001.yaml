# ==============================================================================
# LANG-PY-C-01.yaml
# Explicitness over cleverness
# ==============================================================================

rule:
  id: LANG-ST-PY-001
  execution_view: python_engineer
  constraint: 'Python code MUST favor explicit, readable constructs

    over compact or clever expressions that obscure intent.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Python
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-PY-001
    intent:
      rationale:
      - Favor clarity and maintainability over brevity.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
