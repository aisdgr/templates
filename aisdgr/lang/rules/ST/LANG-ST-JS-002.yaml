# ==============================================================================
# LANG-JS-C-02.yaml
# Strict equality usage
# ==============================================================================

rule:
  id: LANG-ST-JS-002
  execution_view: javascript_engineer
  constraint: 'Strict equality (`===` and `!==`) MUST be used.

    Loose equality (`==` and `!=`) MUST NOT be used.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - JavaScript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JS-002
    intent:
      rationale:
      - Avoid implicit type coercion and ambiguous comparisons.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
