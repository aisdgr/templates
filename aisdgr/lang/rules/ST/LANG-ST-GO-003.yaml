# ==============================================================================
# LANG-GO-C-03.yaml
# Explicit concurrency ownership
# ==============================================================================

rule:
  id: LANG-ST-GO-003
  execution_view: go_engineer
  constraint: 'Concurrency using goroutines and channels

    MUST clearly define ownership, lifecycle,

    and termination conditions.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Go
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-GO-003
    intent:
      rationale:
      - Prevent goroutine leaks and race conditions.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
