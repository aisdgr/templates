# ==============================================================================
# LANG-JAVA-P-04.yaml
# Intent-revealing naming and documentation
# ==============================================================================

rule:
  id: LANG-ST-JV-104
  execution_view: java_engineer
  constraint: 'Public classes, methods, and non-trivial logic

    SHOULD be named and documented to clearly express intent,

    responsibilities, and constraints.


    Documentation MUST explain "what" and "why",

    and MUST NOT be used to justify correctness or approval.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Java
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JAVA-006
    intent:
      rationale:
      - Improve readability, review efficiency, and long-term maintenance.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
