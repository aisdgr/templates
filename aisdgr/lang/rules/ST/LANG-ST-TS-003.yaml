# ==============================================================================
# LANG-TS-C-03.yaml
# No unsafe type assertions
# ==============================================================================

rule:
  id: LANG-ST-TS-003
  execution_view: typescript_engineer
  constraint: 'Unsafe type assertions (e.g. `as any`, double assertions)

    MUST NOT be used.

    Type narrowing MUST be achieved via explicit checks

    or control flow analysis.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - TypeScript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-TS-004
    intent:
      rationale:
      - Prevent bypassing the type system.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
