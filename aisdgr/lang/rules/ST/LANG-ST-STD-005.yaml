# ==============================================================================
# LANG-STD-C-05.yaml
# AI behavior limitation
# ==============================================================================

rule:
  id: LANG-ST-STD-005
  execution_view: code_quality_engineer
  constraint: 'AI-generated code MUST comply with all CCS rules.

    AI MUST NOT introduce constructs that obscure intent,

    bypass governance, or weaken traceability.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages: []
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-STD-007
    intent:
      rationale:
      - Ensure AI remains a constrained executor, not an autonomous designer.
    responsibilities:
      ai:
      - code_generator
