# ==============================================================================
# LANG-STD-P-01.yaml
# Intent-revealing structure
# ==============================================================================

rule:
  id: LANG-ST-STD-101
  execution_view: code_quality_engineer
  constraint: 'Code SHOULD be structured to clearly reveal intent.

    Naming, decomposition, and organization SHOULD favor clarity

    over brevity or cleverness.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages: []
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-STD-005
    intent:
      rationale:
      - Improve long-term maintainability and review efficiency.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
