# ==============================================================================
# LANG-JS-C-01.yaml
# Explicit variable declaration
# ==============================================================================

rule:
  id: LANG-ST-JS-001
  execution_view: javascript_engineer
  constraint: 'Variables MUST be declared explicitly using `const` or `let`.

    `var` MUST NOT be used.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - JavaScript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JS-001
    intent:
      rationale:
      - Prevent scope leakage and implicit global variables.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
