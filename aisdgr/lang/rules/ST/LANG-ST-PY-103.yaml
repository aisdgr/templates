# ==============================================================================
# LANG-PY-P-03.yaml
# Intent-revealing comments and docstrings
# ==============================================================================

rule:
  id: LANG-ST-PY-103
  execution_view: python_engineer
  constraint: 'Public classes, core functions, and non-trivial logic blocks

    SHOULD include concise comments or docstrings that explain intent,

    inputs, and outputs, to support human review and maintenance.


    Comments MUST describe "what" and "why",

    and MUST NOT justify correctness or approval.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Python
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-PY-006
    intent:
      rationale:
      - Improve human readability and review efficiency.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
