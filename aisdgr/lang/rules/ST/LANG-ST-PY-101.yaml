# ==============================================================================
# LANG-PY-P-01.yaml
# Typed data structures
# ==============================================================================

rule:
  id: LANG-ST-PY-101
  execution_view: python_engineer
  constraint: 'Data-only structures such as DTOs, Results, Reports, or Models

    SHOULD be explicitly typed and immutable where practical.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Python
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-PY-003
    intent:
      rationale:
      - Promote safe and predictable data handling.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
