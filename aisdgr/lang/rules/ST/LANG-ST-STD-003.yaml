# ==============================================================================
# LANG-STD-C-03.yaml
# No hidden external dependencies
# ==============================================================================

rule:
  id: LANG-ST-STD-003
  execution_view: code_quality_engineer
  constraint: 'Code MUST NOT rely on undeclared external dependencies,

    environment-specific assumptions, or implicit runtime context.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages: []
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-STD-003
    intent:
      rationale:
      - Ensure portability and reduce environment-coupled failures.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
