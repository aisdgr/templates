# ==============================================================================
# LANG-RS-C-04.yaml
# Deterministic and explicit concurrency
# ==============================================================================

rule:
  id: LANG-ST-RS-004
  execution_view: rust_engineer
  constraint: 'Concurrency MUST be explicit and deterministic.

    Shared state across threads MUST be synchronized

    using safe abstractions (e.g., Mutex, Arc).'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - Rust
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-RS-004
    intent:
      rationale:
      - Prevent data races and undefined behavior in parallel code.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
