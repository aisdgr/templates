# ==============================================================================
# LANG-STD-C-01.yaml
# Deterministic and reproducible behavior
# ==============================================================================

rule:
  id: LANG-ST-STD-001
  execution_view: code_quality_engineer
  constraint: 'Code MUST exhibit deterministic and reproducible behavior.

    Hidden state, non-deterministic side effects, or time-dependent logic

    MUST NOT exist unless explicitly modeled and documented.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages: []
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-STD-001
    intent:
      rationale:
      - Ensure reproducibility, debuggability, and predictable execution.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
