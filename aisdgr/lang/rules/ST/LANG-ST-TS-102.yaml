# ==============================================================================
# LANG-TS-P-02.yaml
# Type-safe async interfaces
# ==============================================================================

rule:
  id: LANG-ST-TS-102
  execution_view: typescript_engineer
  constraint: 'Asynchronous functions SHOULD have explicitly typed

    Promise return values.

    Promise chains SHOULD preserve type information end-to-end.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    languages:
    - TypeScript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-TS-006
    intent:
      rationale:
      - Maintain type safety across asynchronous boundaries.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
