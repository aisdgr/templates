# ==============================================================================
# LANG-RS-C-02.yaml
# No unsafe code by default
# ==============================================================================

rule:
  id: LANG-RS-C-02
  execution_view: rust_engineer
  constraint: 'Use of `unsafe` code MUST be avoided.

    If `unsafe` is required, its scope MUST be minimal

    and explicitly justified and documented.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - rust
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-RS-002
    intent:
      rationale:
      - Preserve Rust’s safety guarantees and auditability.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
