# ==============================================================================
# LANG-JS-P-02.yaml
# Intent-revealing naming and documentation
# ==============================================================================

rule:
  id: LANG-JS-P-02
  execution_view: javascript_engineer
  constraint: 'Public functions, modules, and non-trivial logic

    SHOULD be named and documented to clearly express intent,

    responsibilities, and constraints.


    Documentation MUST explain "what" and "why",

    and MUST NOT be used to justify correctness or approval.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - javascript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JS-007
    intent:
      rationale:
      - Improve readability, review efficiency, and maintainability.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
