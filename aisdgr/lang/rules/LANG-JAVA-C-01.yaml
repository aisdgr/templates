# ==============================================================================
# LANG-JAVA-C-01.yaml
# Explicit type usage
# ==============================================================================

rule:
  id: LANG-JAVA-C-01
  execution_view: java_engineer
  constraint: 'Java code MUST use explicit and appropriate types.

    Overuse of raw types, unchecked casts, or suppressed warnings

    MUST NOT be introduced.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - java
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JAVA-001
    intent:
      rationale:
      - Preserve compile-time safety and reduce runtime type errors.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
