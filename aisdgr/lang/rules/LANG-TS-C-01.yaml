# ==============================================================================
# LANG-TS-C-01.yaml
# Strict type checking enabled
# ==============================================================================

rule:
  id: LANG-TS-C-01
  execution_view: typescript_engineer
  constraint: 'TypeScript projects MUST enable strict type checking.

    Use of `any` MUST be avoided unless explicitly justified

    and locally constrained.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - typescript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-TS-001
    intent:
      rationale:
      - Enforce compile-time guarantees and prevent unsafe assumptions.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
