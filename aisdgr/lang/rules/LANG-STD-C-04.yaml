# ==============================================================================
# LANG-STD-C-04.yaml
# Safe handling of sensitive data
# ==============================================================================

rule:
  id: LANG-STD-C-04
  execution_view: code_quality_engineer
  constraint: 'Sensitive data including secrets, credentials, tokens,

    personal data, or internal confidential values

    MUST NOT be logged, hard-coded, or exposed.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-STD-004
    intent:
      rationale:
      - Prevent accidental leakage of sensitive information, especially from AI-generated
        code.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
