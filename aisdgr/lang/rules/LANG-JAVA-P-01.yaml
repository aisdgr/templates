# ==============================================================================
# LANG-JAVA-P-01.yaml
# Controlled use of inheritance
# ==============================================================================

rule:
  id: LANG-JAVA-P-01
  execution_view: java_engineer
  constraint: 'Inheritance SHOULD be used sparingly.

    Composition SHOULD be preferred over inheritance

    unless polymorphic substitution is explicitly required.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - java
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JAVA-002
    intent:
      rationale:
      - Reduce coupling and improve maintainability.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
