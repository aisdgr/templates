# ==============================================================================
# LANG-JS-P-01.yaml
# Immutable data preference
# ==============================================================================

rule:
  id: LANG-JS-P-01
  execution_view: javascript_engineer
  constraint: 'Data structures SHOULD be treated as immutable where practical.

    Mutation SHOULD be minimized and clearly scoped.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - javascript
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JS-005
    intent:
      rationale:
      - Improve reasoning, reduce side effects, and simplify debugging.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
