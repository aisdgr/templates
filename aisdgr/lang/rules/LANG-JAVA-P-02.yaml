# ==============================================================================
# LANG-JAVA-P-02.yaml
# Checked exception discipline
# ==============================================================================

rule:
  id: LANG-JAVA-P-02
  execution_view: java_engineer
  constraint: 'Checked exceptions SHOULD be used to represent

    recoverable conditions.

    Exceptions MUST NOT be swallowed or silently ignored.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - java
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-JAVA-004
    intent:
      rationale:
      - Preserve meaningful error propagation and handling.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
