# ==============================================================================
# LANG-PY-P-02.yaml
# Boundary input validation
# ==============================================================================

rule:
  id: LANG-PY-P-02
  execution_view: python_engineer
  constraint: 'External inputs (e.g., CLI arguments, API requests)

    SHOULD be validated and typed at system boundaries.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - python
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-PY-004
    intent:
      rationale:
      - Ensure correctness and robustness of external inputs.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
