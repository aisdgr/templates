# ==============================================================================
# LANG-GO-P-03.yaml
# Intent-revealing naming and documentation
# ==============================================================================

rule:
  id: LANG-GO-P-03
  execution_view: go_engineer
  constraint: 'Exported functions, types, and non-trivial logic

    SHOULD be named and documented to clearly express intent,

    responsibilities, and constraints.


    Documentation MUST explain "what" and "why",

    and MUST NOT be used to justify correctness or approval.'
  boundary:
    domain:
    - code
    artifact:
    - source_code
    rule_category: []
    rule_domain:
    - LANG
    language:
    - go
  governance:
    version: 1.0.0
    status: active
    owner: asdgr
    original_rule: CCS-GO-007
    intent:
      rationale:
      - Improve readability, review efficiency, and long-term maintenance.
    responsibilities:
      ai:
      - code_generator
      human:
      - code_reviewer
