# ==============================================================================
# DOCS-CN-C-05: Test Scenario Inference Prohibition
# ==============================================================================

rule:
  id: DOCS-CN-C-05
  execution_view: test_engineer
  constraint: >
    Test scenario inference and fabrication **MUST NOT** be allowed.

  boundary:
    domain:
      - docs
    artifact:
      - sts_document
      - test_scenario_section
    rule_category:
      - constraint_neutrality
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - prevent_test_scenario_hallucination
        - enforce_explicit_test_scenario_declaration
      purpose:
        - ensure_test_scenarios_are_declared_not_inferred
    responsibilities:
      human:
        - test_designer
      ai:
        - test_generator
    applicability_context:
      stage:
        - develop
      scope:
        - test_scenario_generation
      risk:
        - fabricated_test_scenarios
        - implicit_test_assumptions
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - test_integrity
        - scenario_authenticity
