# ==============================================================================
# DOCS-CN-C-01: Implicit Requirement Prohibition
# ==============================================================================

rule:
  id: DOCS-CN-C-01
  execution_view: requirement_engineer
  constraint: >
    AI **MUST NOT** infer or generate implicit requirements.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - requirement_specification
    rule_category:
      - constraint_neutrality
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - prevent_requirement_inference
        - enforce_explicit_specification
      purpose:
        - ensure_all_requirements_are_explicitly_declared
    responsibilities:
      human:
        - requirement_owner
      ai:
        - requirement_generator
    applicability_context:
      stage:
        - develop
      scope:
        - requirement_generation
      risk:
        - hallucination
        - implicit_requirement_injection
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - requirement_traceability
        - specification_integrity
