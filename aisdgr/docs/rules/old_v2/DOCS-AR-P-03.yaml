# ==============================================================================
# DOCS-AR-P-03: Mandatory Artifact Production
# ==============================================================================

rule:
  id: DOCS-AR-P-03
  execution_view: artifact_generator
  constraint: >
    *MUST* produce artifact, forbid no output, forbid false success.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - sts_document
      - generated_artifact
    rule_category:
      - artifact_isolation
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - ensure_artifact_production
        - prevent_empty_or_false_output
      purpose:
        - guarantee_artifact_generation_success
    responsibilities:
      human:
        - request_initiator
      ai:
        - artifact_generator
    applicability_context:
      stage:
        - develop
      scope:
        - artifact_generation
      risk:
        - no_output_failure
        - false_success_indication
      severity: critical
    governance_impact:
      level: enforce
      affected_capabilities:
        - artifact_reliability
        - generation_accountability
