# ==============================================================================
# DOCS-BD-P-02: Explicit Generation Scope
# ==============================================================================

rule:
  id: DOCS-BD-P-02
  execution_view: document_generator
  constraint: >
    AI *MUST* generate content only within explicitly requested sections.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - technical_specification
    rule_category:
      - generation_boundary
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - prevent_autonomous_scope_expansion
        - enforce_user_controlled_generation
      purpose:
        - restrict_generation_to_declared_sections
    responsibilities:
      human:
        - requirement_owner
      ai:
        - document_generator
    applicability_context:
      stage:
        - develop
      scope:
        - document_generation
      risk:
        - scope_creep
        - unauthorized_generation
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - generation_control
        - scope_integrity
