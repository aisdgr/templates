# ==============================================================================
# DOCS-BD-P-03: Placeholder-Restricted Generation
# ==============================================================================

rule:
  id: DOCS-BD-P-03
  execution_view: document_generator
  constraint: >
    AI *MUST* generate content only within declared placeholders.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - template_document
    rule_category:
      - generation_boundary
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - enforce_template_compliance
        - prevent_generation_outside_placeholders
      purpose:
        - restrict_generation_to_designated_areas
    responsibilities:
      human:
        - template_designer
        - requirement_owner
      ai:
        - document_generator
    applicability_context:
      stage:
        - develop
      scope:
        - template_based_generation
      risk:
        - template_violation
        - uncontrolled_generation
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - template_integrity
        - generation_control
