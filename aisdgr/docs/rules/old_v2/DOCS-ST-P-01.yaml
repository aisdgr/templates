# ==============================================================================
# DOCS-ST-P-01: Introduction Sections Informative Only
# ==============================================================================

rule:
  id: DOCS-ST-P-01
  execution_view: document_engineer
  constraint: >
    Introduction-related sections *MUST* be informative only.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - introduction_section
    rule_category:
      - structural_constraint
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - prevent_normative_introduction_content
        - separate_informative_from_normative
      purpose:
        - ensure_introduction_remains_descriptive
    responsibilities:
      human:
        - document_author
      ai:
        - document_generator
    applicability_context:
      stage:
        - develop
      scope:
        - introduction_writing
      risk:
        - normative_confusion
        - requirement_inconsistency
      severity: medium
    governance_impact:
      level: enforce
      affected_capabilities:
        - document_clarity
        - structural_integrity
