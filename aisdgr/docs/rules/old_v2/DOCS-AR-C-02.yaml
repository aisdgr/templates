# ==============================================================================
# DOCS-AR-C-02: Section Visibility Policy Enforcement
# ==============================================================================

rule:
  id: DOCS-AR-C-02
  execution_view: governance_enforcer
  constraint: >
    Section visibility policies (human_only, ai_read, ai_policy) *MUST* be enforced.

  boundary:
    domain:
      - docs
    artifact:
      - sts_document
      - policy_controlled_section
    rule_category:
      - artifact_isolation
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - enforce_section_access_control
        - prevent_policy_violation
      purpose:
        - ensure_visibility_policy_compliance
    responsibilities:
      human:
        - document_owner
        - policy_administrator
      ai:
        - policy_enforcer
    applicability_context:
      stage:
        - develop
      scope:
        - section_access_management
      risk:
        - policy_bypass
        - unauthorized_access
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - access_control
        - policy_compliance
