# ==============================================================================
# DOCS-CN-C-04: Declarative Interface Requirements
# ==============================================================================

rule:
  id: DOCS-CN-C-04
  execution_view: requirement_engineer
  constraint: >
    AI **MUST NOT** infer endpoints, schemas, or protocols.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - interface_requirement_section
    rule_category:
      - constraint_neutrality
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - prevent_interface_inference
        - enforce_explicit_interface_declaration
      purpose:
        - ensure_interfaces_are_fully_declared
    responsibilities:
      human:
        - interface_designer
      ai:
        - requirement_generator
    applicability_context:
      stage:
        - develop
      scope:
        - interface_requirement_definition
      risk:
        - interface_hallucination
        - implicit_protocol_assumption
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - interface_explicitness
        - specification_integrity
