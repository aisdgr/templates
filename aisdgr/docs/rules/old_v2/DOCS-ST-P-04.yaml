# ==============================================================================
# DOCS-ST-P-04: Section Hierarchy Preservation
# ==============================================================================

rule:
  id: DOCS-ST-P-04
  execution_view: document_validator
  constraint: >
    *MUST* preserve section hierarchy and required fields.

  boundary:
    domain:
      - docs
    artifact:
      - srs_document
      - sts_document
      - structured_document
    rule_category:
      - structural_constraint
    rule_domain:
      - DOCS

  governance:
    version: 1.0.0
    status: draft
    owner: aisr
    intent:
      rationale:
        - enforce_structural_integrity
        - prevent_hierarchy_violation
      purpose:
        - maintain_document_structure_compliance
    responsibilities:
      human:
        - document_author
      ai:
        - document_generator
    applicability_context:
      stage:
        - develop
      scope:
        - document_generation
        - structure_validation
      risk:
        - structure_corruption
        - required_field_missing
      severity: high
    governance_impact:
      level: enforce
      affected_capabilities:
        - document_integrity
        - structural_compliance
