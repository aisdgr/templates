# ==============================================================================
# test.execution.ruleset.yaml
# Execute tests without mutating any artifacts.
# ==============================================================================
# Definition:
# - TEST EXECUTION runs existing test artifacts to observe behavior.
# - TEST EXECUTION MUST NOT generate, modify, or delete any artifacts.
# - This ruleset enforces read-only, observation-only execution.
#
# Notes:
# - Rules are scenario-agnostic; execution semantics are expressed only here.
# - Governance metadata is descriptive and MUST NOT influence execution behavior.
# ==============================================================================

ruleset:
  id: test.execution

  # ---------------------------------------------------------------------------
  # Included Rules
  # ---------------------------------------------------------------------------
  # Test execution enforces:
  # - Strict boundary presence
  # - No inference or scope expansion
  # - No artifact mutation
  # - Full execution trace and reporting
  # ---------------------------------------------------------------------------
  includes:

    # ---- BD (Boundary & Stop) ----
    - rule_id: CODE-BD-P-01
      version: ">=1.0.0"
    - rule_id: CODE-BD-P-02
      version: ">=1.0.0"
    - rule_id: CODE-BD-P-03
      version: ">=1.0.0"

    # ---- CN (Constraint Neutrality) ----
    - rule_id: CODE-CN-C-01
      version: ">=1.0.0"
    - rule_id: CODE-CN-C-02
      version: ">=1.0.0"
    - rule_id: CODE-CN-C-03
      version: ">=1.0.0"

    # ---- TI (Test Integrity) ----
    - rule_id: CODE-TI-C-01
      version: ">=1.0.0"
    - rule_id: CODE-TI-C-02
      version: ">=1.0.0"
    - rule_id: CODE-TI-C-03
      version: ">=1.0.0"
    - rule_id: CODE-TI-P-01
      version: ">=1.0.0"
    - rule_id: CODE-TI-C-04
      version: ">=1.0.0"

    # ---- LG (Logging & Report) ----
    - rule_id: CODE-LG-P-01
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-02
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-03
      version: ">=1.0.0"

  # ---------------------------------------------------------------------------
  # Applicability (Decision Lens)
  # ---------------------------------------------------------------------------
  applicability:
    domain:
      - code
    artifact:
      - test_code
    intent:
      - execution
    stage:
      - develop

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: "1.0.0"
    status: active
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent (Why this ruleset exists)
    # -------------------------------------------------------------------------
    intent:
      purpose:
        - behavioral_observation
        - regression_detection
      non_goals:
        - artifact_generation
        - artifact_modification
        - scope_expansion
      notes:
        - "Test execution is strictly observational and MUST NOT mutate any artifacts."

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - test_executor
      human:
        - code_regulator
      system:
        - execution_monitor

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      enforcement_level: strict
      failure_mode: fail_stop
      audit_scope:
        - test_execution_runs
      reporting:
        - execution_log
        - test_result_summary
      risk_category:
        - unintended_mutation
        - scope_violation
        - untraceable_execution
