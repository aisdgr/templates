# ==============================================================================
# test_code.fix.ruleset.yaml
# Fix existing test code artifacts with minimal, bounded changes.
# ==============================================================================
# Definition:
# - FIX TEST focuses on correcting defects in existing test code.
# - FIX TEST MUST NOT modify production source code.
# - FIX TEST MUST NOT expand validation scope or redefine expected behavior.
# - Changes MUST be minimal and directly related to defect correction.
#
# Notes:
# - Rules are scenario-agnostic; FIX semantics are expressed only at the ruleset level.
# - Governance metadata is descriptive and MUST NOT influence execution behavior.
# ==============================================================================

ruleset:
  id: test_code.fix

  # ---------------------------------------------------------------------------
  # Included Rules
  # ---------------------------------------------------------------------------
  # Test code fix enforces minimality and strict isolation:
  # - No production code impact
  # - No new test scenarios
  # - No scope or intent expansion
  # ---------------------------------------------------------------------------
  includes:

    # ---- BD (Boundary & Stop) ----
    - rule_id: CODE-BD-P-01
      version: ">=1.0.0"
    - rule_id: CODE-BD-P-02
      version: ">=1.0.0"
    - rule_id: CODE-BD-P-03
      version: ">=1.0.0"
    - rule_id: CODE-BD-C-01
      version: ">=1.0.0"
    - rule_id: CODE-BD-C-02
      version: ">=1.0.0"
    - rule_id: CODE-BD-C-03
      version: ">=1.0.0"

    # ---- CN (Constraint Neutrality) ----
    - rule_id: CODE-CN-C-01
      version: ">=1.0.0"
    - rule_id: CODE-CN-C-02
      version: ">=1.0.0"
    - rule_id: CODE-CN-C-03
      version: ">=1.0.0"

    # ---- AR (Artifact Isolation) ----
    - rule_id: CODE-AR-P-01
      version: ">=1.0.0"
    - rule_id: CODE-AR-C-01
      version: ">=1.0.0"
    - rule_id: CODE-AR-C-02
      version: ">=1.0.0"
    - rule_id: CODE-AR-C-03
      version: ">=1.0.0"
    - rule_id: CODE-AR-P-02
      version: ">=1.0.0"

    # ---- TI (Test Integrity) ----
    - rule_id: CODE-TI-C-01
      version: ">=1.0.0"
    - rule_id: CODE-TI-C-02
      version: ">=1.0.0"
    - rule_id: CODE-TI-C-03
      version: ">=1.0.0"
    - rule_id: CODE-TI-P-01
      version: ">=1.0.0"
    - rule_id: CODE-TI-C-04
      version: ">=1.0.0"

    # ---- LG (Logging & Report) ----
    - rule_id: CODE-LG-P-01
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-02
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-03
      version: ">=1.0.0"
    - rule_id: CODE-LG-C-01
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-04
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-05
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-06
      version: ">=1.0.0"
    - rule_id: CODE-LG-P-07
      version: ">=1.0.0"
    - rule_id: CODE-LG-C-02
      version: ">=1.0.0"

  # ---------------------------------------------------------------------------
  # Applicability (Decision Lens)
  # ---------------------------------------------------------------------------
  applicability:
    domain:
      - code
    artifact:
      - test_code
    intent:
      - fix
    stage:
      - develop

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: "1.0.0"
    status: active
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent (Why this ruleset exists)
    # -------------------------------------------------------------------------
    intent:
      purpose:
        - test_defect_correction
        - regression_prevention
      non_goals:
        - new_test_scenarios
        - validation_scope_expansion
        - production_code_change
      notes:
        - "Test code fixes are limited to correcting defects in existing tests and MUST preserve original validation intent."

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_generator
      human:
        - code_regulator
      system:
        - validator

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      enforcement_level: strict
      failure_mode: fail_stop
      audit_scope:
        - modified_test_code
      reporting:
        - rule_evaluation_report
        - fix_summary
      risk_category:
        - test_scope_drift
        - validation_distortion
        - traceability
