# ==============================================================================
# CODE-LG-03.yaml
# Each execution MUST include a rationale.
# ==============================================================================

rule:
  id: CODE-LG-03
  execution_view: logging_engineer

  constraint: >
    Each code execution MUST include a non-empty rationale
    explaining why the execution was performed.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - execution_record
    rule_category:
      - logging
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - preserve_decision_context
        - prevent_silent_execution
        - enable_post_hoc_analysis

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - execution_logger
        - rationale_collector

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_execution
      risk:
        - accountability
        - governance
      severity:
        - medium
      reason:
        - missing_execution_rationale
        - opaque_execution_decision

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: enforce
      affected_capabilities:
        - accountability
        - auditability
        - decision_traceability
