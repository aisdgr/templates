# ==============================================================================
# CODE-ST-P-01.yaml
# Permission for structural refactoring MUST be explicit.
# ==============================================================================

rule:
  id: CODE-ST-P-01
  execution_view: structure_engineer

  constraint: >
    Permission for structural refactoring MUST be
    explicitly declared before execution.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - structural_change
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_implicit_refactoring
        - separate_structure_from_logic_change
        - enforce_explicit_structural_intent

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - structure_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - structural_refactoring
      risk:
        - architecture
      severity:
        - high
      reason:
        - missing_structural_refactor_permission
        - implicit_structure_change_risk

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: gating
      affected_capabilities:
        - architectural_stability
        - change_predictability
        - auditability
