# ==============================================================================
# CODE-AR-P-02.yaml
# All generated artifacts MUST be addressable and locatable.
# ==============================================================================

rule:
  id: CODE-AR-P-02
  execution_view: artifact_engineer

  constraint: >
    All generated artifacts MUST be addressable and locatable
    within the execution context.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - artifact
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: superseded
    superseded_by: CORE-AR-P-002
    superseded_date: 2026-03-19
    superseded_reason: "移至 CORE Domain 作為通用規則"
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_unreachable_artifacts
        - ensure_artifact_traceability
        - enable_post_execution_audit

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - artifact_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - artifact_creation
      reason:
        - non_addressable_artifact
        - non_locatable_artifact
        - audit_failure_risk

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - artifact_traceability
        - auditability
        - execution_transparency
