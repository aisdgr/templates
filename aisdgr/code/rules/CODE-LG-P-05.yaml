# ==============================================================================
# CODE-LG-P-05.yaml
# Change summaries MUST match actual code changes.
# ==============================================================================

rule:
  id: CODE-LG-P-05
  execution_view: logging_engineer

  constraint: >
    Change summaries MUST accurately reflect
    the actual code changes performed.

  boundary:
    domain:
      - code
    artifact:
      - execution_record
      - source_code
    rule_category:
      - logging
    rule_domain:
      - CODE

  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    intent:
      rationale:
        - prevent_misleading_summaries
        - ensure_change_integrity

    responsibilities:
      system:
        - diff_analyzer
        - summary_validator

    applicability_context:
      stage:
        - develop
      scope:
        - code_change
      risk:
        - auditability
      severity:
        - high
      reason:
        - summary_mismatch

    governance_impact:
      level: enforce
      affected_capabilities:
        - forensic_analysis
        - accountability
