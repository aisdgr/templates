# ==============================================================================
# CODE-CN-03.yaml
# Undeclared validation targets MUST NOT be inferred.
# ==============================================================================

rule:
  id: CODE-CN-03
  execution_view: constraint_engineer

  constraint: >
    Undeclared validation targets MUST NOT be inferred
    during code execution.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - constraint_neutrality
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_validation_target_inference
        - preserve_validation_authority
        - eliminate_implicit_verification_scope

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - validation_target_validator
        - constraint_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - validation_resolution
        - code_execution
      risk:
        - scope
        - governance
      severity:
        - high
      reason:
        - inferred_validation_target
        - implicit_verification_scope

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - validation_decidability
        - execution_safety
        - auditability
