# ==============================================================================
# CODE-LG-C-01.yaml
# Rationales MUST NOT be empty or purely repetitive.
# ==============================================================================

rule:
  id: CODE-LG-C-001
  execution_view: logging_engineer

  constraint: >
    Execution rationales MUST NOT be empty,
    generic, or purely repetitive across executions.

  boundary:
    domain:
      - code
    artifact:
      - execution_record
    rule_category:
      - logging
    rule_domain:
      - CODE

  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    intent:
      rationale:
        - prevent_placeholder_justification
        - ensure_meaningful_rationale

    responsibilities:
      system:
        - rationale_validator

    applicability_context:
      stage:
        - develop
      scope:
        - execution_logging
      risk:
        - accountability
      severity:
        - medium
      reason:
        - empty_rationale
        - repetitive_rationale

    governance_impact:
      level: enforce
      affected_capabilities:
        - accountability
        - auditability
