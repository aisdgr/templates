# ==============================================================================
# CODE-LG-P-07.yaml
# Rule reports MUST include per-rule evaluation results.
# ==============================================================================

rule:
  id: CODE-LG-P-007
  execution_view: governance_observer

  constraint: >
    Rule-evaluation reports MUST include
    explicit pass or fail results for each applied rule.

  boundary:
    domain:
      - code
    artifact:
      - rule_report
    rule_category:
      - logging
      - governance
    rule_domain:
      - CODE

  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    intent:
      rationale:
        - ensure_rule_transparency
        - enable_post_execution_review

    responsibilities:
      system:
        - rule_evaluator

    applicability_context:
      stage:
        - develop
      scope:
        - rule_reporting
      risk:
        - governance
      severity:
        - high
      reason:
        - incomplete_rule_report

    governance_impact:
      level: enforce
      affected_capabilities:
        - traceable_governance
        - auditability
