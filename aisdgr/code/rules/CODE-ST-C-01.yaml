# ==============================================================================
# CODE-ST-C-01.yaml
# Unauthorized structural refactoring is forbidden.
# ==============================================================================

rule:
  id: CODE-ST-C-01
  execution_view: structure_engineer

  constraint: >
    Code execution MUST NOT perform any structural refactoring
    unless explicit permission for structural refactoring
    has been declared.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - structural_change
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_unauthorized_structural_change
        - enforce_structural_permission_boundary
        - eliminate_implicit_refactoring

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - structure_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - structural_refactoring
      risk:
        - architecture
      severity:
        - high
      reason:
        - unauthorized_structural_refactor
        - implicit_structure_change

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - architectural_stability
        - execution_safety
        - auditability
