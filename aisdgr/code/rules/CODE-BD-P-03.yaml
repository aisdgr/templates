# ==============================================================================
# CODE-BD-P-03.yaml
# Code execution MUST stop if declared boundaries contain no actionable targets.
# ==============================================================================

rule:
  id: CODE-BD-P-03
  execution_view: boundary_engineer
  constraint: >
    Code execution MUST stop if the declared boundary
    resolves to an empty execution target set.


  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - boundary
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_null_execution
        - avoid_no_op_modification

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - boundary_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_execution
      reason:
        - empty_boundary_resolution
        - no_actionable_targets

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - boundary_enforcement
        - execution_safety
        - auditability
