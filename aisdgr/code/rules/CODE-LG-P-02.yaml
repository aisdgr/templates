# ==============================================================================
# CODE-LG-P-02.yaml
# Execution records MUST be linked to the corresponding Trace ID.
# ==============================================================================

rule:
  id: CODE-LG-P-02
  execution_view: logging_engineer

  constraint: >
    Each execution record MUST be explicitly linked
    to the corresponding Trace ID used in the affected code artifacts.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - execution_record
      - source_code
    rule_category:
      - logging
      - traceability
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - bind_execution_to_code_identity
        - prevent_unattributed_execution
        - enable_end_to_end_traceability

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - execution_logger
        - trace_linker

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_execution
      risk:
        - traceability
        - auditability
      severity:
        - high
      reason:
        - execution_without_trace_link
        - orphan_execution_record

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: enforce
      affected_capabilities:
        - end_to_end_traceability
        - auditability
        - forensic_analysis
