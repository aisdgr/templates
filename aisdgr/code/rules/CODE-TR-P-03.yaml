# ==============================================================================
# CODE-TR-P-03.yaml
# A single code change MUST NOT contain multiple Trace IDs.
# ==============================================================================
rule:
  id: CODE-TR-P-03
  execution_view: traceability_engineer
  constraint: >
    Each output source code artifact produced by a single execution
    MUST reference exactly one Trace ID.


  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - traceability
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: superseded
    superseded_by: CORE-TR-P-003
    superseded_date: 2026-03-19
    superseded_reason: "移至 CORE Domain 作為通用規則"
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - ensure_trace_to_change_uniqueness
        - prevent_mixed_trace_contexts
        - maintain_auditable_change_history

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_generator
      human:
        - code_regulator
      system:
        - validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_generation
        - code_modification
      risk: traceability
      severity: high
      reason:
        - multiple_trace_ids_in_single_change
        - ambiguous_change_origin
        - broken_trace_to_execution_mapping

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: foundational
      affected_capabilities:
        - traceability
        - auditability
        - accountability
