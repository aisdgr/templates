# ==============================================================================
# CODE-TI-C-01.yaml
# Test artifacts MUST NOT modify or affect production code.
# ==============================================================================

rule:
  id: CODE-TI-C-001
  execution_view: test_integrity_engineer

  constraint: >
    Test artifacts MUST NOT modify or affect
    production source code.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - test_artifact
    rule_category:
      - test_integrity
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_test_driven_code_mutation
        - preserve_production_code_integrity
        - enforce_test_production_separation

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - test_validator
        - artifact_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - test_execution
        - test_generation
        - test_modification
      risk:
        - correctness
        - isolation
      severity:
        - high
      reason:
        - test_affecting_production_code
        - test_integrity_violation

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - test_isolation
        - production_stability
        - auditability
