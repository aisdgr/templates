# ==============================================================================
# CODE-BD-C-01.yaml
# Code MUST NOT modify artifacts outside the declared boundary.
# ==============================================================================

rule:
  id: CODE-BD-C-01
  execution_view: boundary_engineer

  constraint: >
    Code execution MUST NOT modify any code artifact
    that is not contained within the resolved execution boundary.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - boundary
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_boundary_escape
        - enforce_execution_containment

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - boundary_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_execution
      reason:
        - modification_outside_boundary
        - boundary_violation

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - boundary_enforcement
        - execution_safety
        - auditability
