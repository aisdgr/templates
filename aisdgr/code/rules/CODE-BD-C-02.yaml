# ==============================================================================
# CODE-BD-C-02.yaml
# Code MUST NOT access modules or resources outside the declared boundary.
# ==============================================================================

rule:
  id: CODE-BD-C-02
  execution_view: boundary_engineer

  constraint: >
    Code execution MUST NOT access any module or resource
    that is not contained within the resolved execution boundary.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - boundary
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: superseded
    superseded_by: CORE-BD-C-002
    superseded_date: 2026-03-19
    superseded_reason: "移至 CORE Domain 作為通用規則"
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_boundary_escape
        - enforce_resource_containment

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - boundary_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - code_execution
      reason:
        - access_outside_boundary
        - boundary_violation

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - boundary_enforcement
        - execution_safety
        - auditability
