# ==============================================================================
# CODE-CN-C-01.yaml
# Undeclared boundaries MUST NOT be inferred.
# ==============================================================================

rule:
  id: CODE-CN-C-01
  execution_view: constraint_engineer

  constraint: >
    Undeclared boundaries MUST NOT be inferred
    during code execution.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - constraint_neutrality
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: superseded
    superseded_by: CORE-CN-C-001
    superseded_date: 2026-03-19
    superseded_reason: "移至 CORE Domain 作為通用規則"
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - eliminate_implicit_scope_inference
        - preserve_decidability
        - enforce_explicit_boundary_declaration

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - boundary_validator
        - constraint_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - boundary_resolution
        - code_execution
      risk:
        - scope
        - governance
      severity:
        - high
      reason:
        - inferred_boundary_detected
        - implicit_scope_resolution

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - boundary_decidability
        - execution_safety
        - auditability
