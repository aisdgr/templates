# ==============================================================================
# source_code.change.yaml
#
# Ruleset Role:
#   This ruleset defines how changes to existing production source code
#   are governed by composing scenario-agnostic CODE rules.
#
# Execution Semantics:
#   - Existing production source code may be modified within declared boundaries
#   - No implicit inference, scope expansion, or cross-artifact modification is allowed
#   - All changes MUST remain traceable, auditable, and boundary-compliant
#
# Governance Semantics:
#   - Change is interpreted as a bounded behavior-adjustment intent
#   - This ruleset allows modification of existing code but does not permit
#     structural refactoring or uncontrolled feature expansion
#   - It is more permissive than FIX on behavioral change, but stricter than ADD
#     on introducing new code
#
# Design Notes:
#   - Individual rules are scenario-agnostic and reusable
#   - Intent semantics are expressed ONLY at the ruleset level
#   - Rulesets select and compose rules; they never redefine rule behavior
#
# ==============================================================================

ruleset:
  id: source_code.change

  # ---------------------------------------------------------------------------
  # Included Rules (Execution Semantics)
  # ---------------------------------------------------------------------------
  includes:

    # ---- BD: Boundary & Stop ----
    - rule_id: CODE-BD-01
      version: ">=1.0.0"
    - rule_id: CODE-BD-02
      version: ">=1.0.0"
    - rule_id: CODE-BD-03
      version: ">=1.0.0"
    - rule_id: CODE-BD-04
      version: ">=1.0.0"
    - rule_id: CODE-BD-05
      version: ">=1.0.0"
    - rule_id: CODE-BD-06
      version: ">=1.0.0"

    # ---- CN: Constraint Neutrality ----
    - rule_id: CODE-CN-01
      version: ">=1.0.0"
    - rule_id: CODE-CN-02
      version: ">=1.0.0"
    - rule_id: CODE-CN-03
      version: ">=1.0.0"

    # ---- TR: Traceability ----
    - rule_id: CODE-TR-01
      version: ">=1.0.0"
    - rule_id: CODE-TR-02
      version: ">=1.0.0"
    - rule_id: CODE-TR-03
      version: ">=1.0.0"
    - rule_id: CODE-TR-04
      version: ">=1.0.0"

    # ---- AR: Artifact Isolation ----
    - rule_id: CODE-AR-01
      version: ">=1.0.0"
    - rule_id: CODE-AR-02
      version: ">=1.0.0"
    - rule_id: CODE-AR-03
      version: ">=1.0.0"
    - rule_id: CODE-AR-04
      version: ">=1.0.0"
    - rule_id: CODE-AR-05
      version: ">=1.0.0"

    # ---- LG: Logging & Report ----
    - rule_id: CODE-LG-01
      version: ">=1.0.0"
    - rule_id: CODE-LG-02
      version: ">=1.0.0"
    - rule_id: CODE-LG-03
      version: ">=1.0.0"
    - rule_id: CODE-LG-04
      version: ">=1.0.0"
    - rule_id: CODE-LG-05
      version: ">=1.0.0"
    - rule_id: CODE-LG-06
      version: ">=1.0.0"
    - rule_id: CODE-LG-07
      version: ">=1.0.0"
    - rule_id: CODE-LG-08
      version: ">=1.0.0"
    - rule_id: CODE-LG-09
      version: ">=1.0.0"

  # ---------------------------------------------------------------------------
  # Applicability (Governance Lens)
  # ---------------------------------------------------------------------------
  applicability:
    domain: [code]
    artifact: [source_code]
    intent: [change]
    stage: [develop]

  # ---------------------------------------------------------------------------
  # Governance Metadata
  # ---------------------------------------------------------------------------
  # Governance metadata is descriptive and MUST NOT influence execution behavior.
  governance:
    version: "1.0.0"
    status: active
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent (Governance meaning of change)
    # -------------------------------------------------------------------------
    intent:
      purpose:
        - controlled_behavior_adjustment
        - requirement_alignment
      non_goals:
        - feature_introduction
        - structural_refactoring
      notes:
        - "This ruleset governs bounded modifications to existing production source code."

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_generator
      human:
        - code_regulator
      system:
        - validator

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      audit_scope:
        - modified_source_code
      reporting:
        - rule_evaluation_report
        - change_summary
      risk_category:
        - boundary
        - inference
        - traceability
        - behavior_drift
