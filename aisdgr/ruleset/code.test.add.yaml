# ==============================================================================
# test_code.add.yaml
# Add new test code artifacts without affecting production source code.
# ==============================================================================
# Definition:
# - ADD TEST focuses on creating new test artifacts only.
# - ADD TEST MUST NOT modify production source code or expand execution scope.
#
# Notes:
# - Rules are scenario-agnostic; ADD semantics are expressed only at the ruleset level.
# - Governance metadata is descriptive and MUST NOT influence execution behavior.
# ==============================================================================

ruleset:
  id: test_code.add

  # ---------------------------------------------------------------------------
  # Included Rules
  # ---------------------------------------------------------------------------
  # Test code addition enforces strict boundary isolation:
  # - No production code modification
  # - No inference of requirements
  # - Full traceability and auditability
  # ---------------------------------------------------------------------------
  includes:

    # ---- BD (Boundary & Stop) ----
    - rule_id: CODE-BD-01
      version: ">=1.0.0"
    - rule_id: CODE-BD-02
      version: ">=1.0.0"
    - rule_id: CODE-BD-03
      version: ">=1.0.0"
    - rule_id: CODE-BD-04
      version: ">=1.0.0"
    - rule_id: CODE-BD-05
      version: ">=1.0.0"
    - rule_id: CODE-BD-06
      version: ">=1.0.0"

    # ---- CN (Constraint Neutrality) ----
    - rule_id: CODE-CN-01
      version: ">=1.0.0"
    - rule_id: CODE-CN-02
      version: ">=1.0.0"
    - rule_id: CODE-CN-03
      version: ">=1.0.0"

    # ---- AR (Artifact Isolation) ----
    - rule_id: CODE-AR-01
      version: ">=1.0.0"
    - rule_id: CODE-AR-02
      version: ">=1.0.0"
    - rule_id: CODE-AR-03
      version: ">=1.0.0"
    - rule_id: CODE-AR-04
      version: ">=1.0.0"
    - rule_id: CODE-AR-05
      version: ">=1.0.0"

    # ---- TI (Test Integrity) ----
    - rule_id: CODE-TI-01
      version: ">=1.0.0"
    - rule_id: CODE-TI-02
      version: ">=1.0.0"
    - rule_id: CODE-TI-03
      version: ">=1.0.0"
    - rule_id: CODE-TI-04
      version: ">=1.0.0"
    - rule_id: CODE-TI-05
      version: ">=1.0.0"

    # ---- LG (Logging & Report) ----
    - rule_id: CODE-LG-01
      version: ">=1.0.0"
    - rule_id: CODE-LG-02
      version: ">=1.0.0"
    - rule_id: CODE-LG-03
      version: ">=1.0.0"
    - rule_id: CODE-LG-04
      version: ">=1.0.0"
    - rule_id: CODE-LG-05
      version: ">=1.0.0"
    - rule_id: CODE-LG-06
      version: ">=1.0.0"
    - rule_id: CODE-LG-07
      version: ">=1.0.0"
    - rule_id: CODE-LG-08
      version: ">=1.0.0"
    - rule_id: CODE-LG-09
      version: ">=1.0.0"

  # ---------------------------------------------------------------------------
  # Applicability (Decision Lens)
  # ---------------------------------------------------------------------------
  applicability:
    domain:
      - code
    artifact:
      - test_code
    intent:
      - add
    stage:
      - develop

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: "1.0.0"
    status: active
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent (Why this ruleset exists)
    # -------------------------------------------------------------------------
    intent:
      purpose:
        - test_coverage_expansion
        - validation_support
      non_goals:
        - production_code_change
        - requirement_inference
        - behavior_definition
      notes:
        - "Test code addition is limited to test artifacts and MUST remain isolated from production logic."

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_generator
      human:
        - code_regulator
      system:
        - validator

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      enforcement_level: strict
      failure_mode: fail_stop
      audit_scope:
        - generated_test_code
      reporting:
        - rule_evaluation_report
        - change_summary
      risk_category:
        - test_scope_expansion
        - production_contamination
        - traceability
