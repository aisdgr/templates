# ==============================================================================
# source_code.refactor.yaml
# Structural refactoring of production source code without behavior change.
# ==============================================================================
# Definition:
# - REFACTOR allows structural modification of existing code.
# - REFACTOR MUST preserve externally observable behavior.
# - REFACTOR MUST NOT introduce new functionality, scope expansion, or hidden logic changes.
#
# Notes:
# - Rules are scenario-agnostic; REFACTOR semantics are expressed only at the ruleset level.
# - Governance metadata is descriptive and MUST NOT influence execution behavior.
# ==============================================================================

ruleset:
  id: source_code.refactor

  # ---------------------------------------------------------------------------
  # Included Rules
  # ---------------------------------------------------------------------------
  # Boundary-first, fail-stop enforcement with no inference.
  # Structural change is permitted only when explicitly declared (ST-01),
  # but logic/behavior change and feature introduction remain forbidden.
  # ---------------------------------------------------------------------------
  includes:

    # ---- BD (Boundary & Stop) ----
    - rule_id: CODE-BD-01
      version: ">=1.0.0"
    - rule_id: CODE-BD-02
      version: ">=1.0.0"
    - rule_id: CODE-BD-03
      version: ">=1.0.0"
    - rule_id: CODE-BD-04
      version: ">=1.0.0"
    - rule_id: CODE-BD-05
      version: ">=1.0.0"
    - rule_id: CODE-BD-06
      version: ">=1.0.0"

    # ---- CN (Constraint Neutrality) ----
    - rule_id: CODE-CN-01
      version: ">=1.0.0"
    - rule_id: CODE-CN-02
      version: ">=1.0.0"
    - rule_id: CODE-CN-03
      version: ">=1.0.0"

    # ---- TR (Traceability) ----
    - rule_id: CODE-TR-01
      version: ">=1.0.0"
    - rule_id: CODE-TR-02
      version: ">=1.0.0"
    - rule_id: CODE-TR-03
      version: ">=1.0.0"
    - rule_id: CODE-TR-04
      version: ">=1.0.0"

    # ---- AR (Artifact Isolation) ----
    - rule_id: CODE-AR-01
      version: ">=1.0.0"
    - rule_id: CODE-AR-02
      version: ">=1.0.0"
    - rule_id: CODE-AR-03
      version: ">=1.0.0"
    - rule_id: CODE-AR-04
      version: ">=1.0.0"
    - rule_id: CODE-AR-05
      version: ">=1.0.0"

    # ---- ST (Structural Change — Allowed in REFACTOR) ----
    - rule_id: CODE-ST-01
      version: ">=1.0.0"
    - rule_id: CODE-ST-03
      version: ">=1.0.0"
    - rule_id: CODE-ST-04
      version: ">=1.0.0"
    - rule_id: CODE-ST-05
      version: ">=1.0.0"

    # ---- LG (Logging & Report) ----
    - rule_id: CODE-LG-01
      version: ">=1.0.0"
    - rule_id: CODE-LG-02
      version: ">=1.0.0"
    - rule_id: CODE-LG-03
      version: ">=1.0.0"
    - rule_id: CODE-LG-04
      version: ">=1.0.0"
    - rule_id: CODE-LG-05
      version: ">=1.0.0"
    - rule_id: CODE-LG-06
      version: ">=1.0.0"
    - rule_id: CODE-LG-07
      version: ">=1.0.0"
    - rule_id: CODE-LG-08
      version: ">=1.0.0"
    - rule_id: CODE-LG-09
      version: ">=1.0.0"

  # ---------------------------------------------------------------------------
  # Applicability (Decision Lens)
  # ---------------------------------------------------------------------------
  applicability:
    domain:
      - code
    artifact:
      - source_code
    intent:
      - refactor
    stage:
      - develop

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: "1.0.0"
    status: active
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent (Governance meaning of refactor)
    # -------------------------------------------------------------------------
    intent:
      purpose:
        - structural_improvement
        - maintainability
        - readability
      non_goals:
        - feature_addition
        - behavior_change
        - defect_fix
      notes:
        - "Refactor is defined as structure-only change. Observable behavior MUST remain equivalent."

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_generator
      human:
        - code_regulator
      system:
        - validator

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      enforcement_level: strict
      failure_mode: fail_stop
      audit_scope:
        - modified_source_code
      reporting:
        - rule_evaluation_report
        - change_summary
      risk_category:
        - hidden_behavior_change
        - scope_violation
        - traceability
        - untraceable_structure_change
