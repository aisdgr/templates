schema:             # 架構
  name: AIGD-CNL    # 名稱
  version: 1.0      # 版本
  description: >    # 描述
    AIGD 受控自然語言 (CNL) 架構。
    本架構定義了有效規範性句子的語法與規範結構。
    它並不定義文件結構、強制執行、適用性或執行語義。

# ==============================================================================
# Normative Keywords (規範性關鍵字)
# ==============================================================================

normative_keywords: # 規範性關鍵字
  description: >    # 描述
    定義需求強度的規範性關鍵字。
  enum:             # 列舉
    - MUST          # 必須 (絕對義務)
    - MUST NOT      # 絕不可 (絕對禁止)
    - SHOULD        # 應該 (建議事項)
    - MAY           # 可以 (選填事項)

# ==============================================================================
# Sentence Patterns (句子模式)
# ==============================================================================

sentence_patterns:  # 句子模式
  description: >    # 描述
    規範性句子允許的語法模式。
    主體與動作為自由格式的自然語言，
    而規範性關鍵字「必須」是定義好的關鍵字之一。
  enum:             # 列舉
    - "<SUBJECT> <KEYWORD> <ACTION>"          # "<主體> <關鍵字> <動作>"
    - "<SUBJECT> <KEYWORD> <ACTION> <TARGET>" # "<主體> <關鍵字> <動作> <目標>"

# ==============================================================================
# Sentence Components (句子組成要素)
# ==============================================================================

components:         # 組成要素

  subject:          # 主體
    description: >  # 描述
      句子的語法主體。
      此為自由格式的自然語言文本。
    type: string    # 類型: 字串

  keyword:          # 關鍵字
    description: >  # 描述
      指示需求強度的規範性關鍵字。
    type: string    # 類型: 字串
    enum_ref: normative_keywords # 列舉引用: 規範性關鍵字

  action:           # 動作
    description: >  # 描述
      句子所表達的動作或約束。
      此為自由格式的自然語言文本。
    type: string    # 類型: 字串

  target:           # 目標
    description: >  # 描述
      作為句子一部分的選填語法目標，
      以自然語言指示上下文範圍。
    type: string    # 類型: 字串
    optional: true  # 選填: 是

# ==============================================================================
# Validation Rules (驗證規則)
# ==============================================================================

validation:         # 驗證
  description: >    # 描述
    一個有效的 CNL 句子「必須」：
    - 包含恰好一個規範性關鍵字
    - 符合其中一個允許的句子模式
    - 使用定義在 normative_keywords 中的關鍵字
