schema:
  name: AIGD-CNL
  version: 1.0
  description: >
    AIGD Controlled Natural Language (CNL) schema.
    This schema defines the grammatical and normative
    structure of a valid normative sentence.
    It does NOT define document structure, enforcement,
    applicability, or execution semantics.

# ==============================================================================
# Normative Keywords
# ==============================================================================

normative_keywords:
  description: >
    Normative keywords that define the strength of a requirement.
  enum:
    - MUST
    - MUST NOT
    - SHOULD
    - MAY

# ==============================================================================
# Sentence Patterns
# ==============================================================================

sentence_patterns:
  description: >
    Allowed grammatical patterns for normative sentences.
    The subject and action are free-form natural language,
    while the normative keyword MUST be one of the defined keywords.
  enum:
    - "<SUBJECT> <KEYWORD> <ACTION>"
    - "<SUBJECT> <KEYWORD> <ACTION> <TARGET>"

# ==============================================================================
# Sentence Components
# ==============================================================================

components:

  subject:
    description: >
      Grammatical subject of the sentence.
      This is free-form natural language text.
    type: string

  keyword:
    description: >
      Normative keyword indicating requirement strength.
    type: string
    enum_ref: normative_keywords

  action:
    description: >
      Action or constraint expressed by the sentence.
      This is free-form natural language text.
    type: string

  target:
    description: >
      Optional grammatical target expressed as part of the sentence,
      indicating the contextual scope in natural language.
    type: string
    optional: true

# ==============================================================================
# Validation Rules
# ==============================================================================

validation:
  description: >
    A valid CNL sentence MUST:
      - Contain exactly one normative keyword
      - Match one of the allowed sentence patterns
      - Use a keyword defined in normative_keywords
