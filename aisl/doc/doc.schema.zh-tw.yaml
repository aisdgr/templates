# ==============================================================================
# AISL 文件架構 (AISL Document Schema)
# ------------------------------------------------------------------------------
# 定義 AISL 規則文件的結構化容器模型。
#
# 一份文件宣告了：
#   - 自身的身份與目的 (meta)
#   - 允許的適用上下文 (intent / roles / applies_to)
#   - 遵循 rule.schema.yaml 規範的規則清單
#
# 本架構「僅定義結構」。
# 絕不可定義規則語義、執行行為或政策邏輯。
# ==============================================================================

schema:                       # 架構
  name: AISL-Document-Schema  # 名稱
  version: 1.1                # 版本
  description: >              # 描述
    AISL 文件的結構化架構。
    本架構定義了文件層級的元數據、適用上下文，以及規則的容器結構。
    它並不定義規則行為或執行邏輯。

# ==============================================================================
# Document Root (文件根節點)
# ==============================================================================

document:           # 文件
  struct: object    # 結構：物件
  required:         # 必填項目
    - meta
    - applicability_context
    - rules

  properties:       # 屬性定義

    # --------------------------------------------------------------------------
    # Document Metadata (Structural Only) (文件元數據 - 僅限結構)
    # --------------------------------------------------------------------------
    meta:                # 元數據
      type: object       # 類型：物件
      description: >     # 描述
        定義此 AISL 文件身份、目的與所有權的文件層級元數據。
      required:          # 必填項目
        - id
        - title

      properties:             # 屬性內容

        id:                   # 識別碼
          type: string        # 類型：字串
          description: >      # 描述
            此文件的全球唯一識別碼。

        title:                # 標題
          type: string        # 類型：字串
          description: >      # 描述
            此文件的人類可讀標題。

        version:              # 版本
          type: string        # 類型：字串
          description: >      # 描述
            此文件的版本。
        status:               # 狀態
          type: string        # 類型：字串
          enum:               # 列舉值
            - draft           # 草案
            - active          # 啟用
            - deprecated      # 廢止
          description: >      # 描述
            文件的生命週期狀態。

        action:               # 動作
          type: string        # 類型：字串
          enum:               # 列舉值
            - generate        # 生成
            - modify          # 修改
            - decide          # 決策
            - recommend       # 建議
            - analyze         # 分析
          description: >      # 描述
            與此文件相關的主要 AI 動作的高階分類。
            此欄位僅具描述性質。

        artifact:             # 產出物
          type: string        # 類型：字串
          description: >      # 描述
            此文件治理的目標產出物類別 (例如：文件、代碼、配置、測試、模型)。

        owner:                # 所有者
          type: string        # 類型：字串
          description: >      # 描述
            此文件的所有者或負責方。
      additional_properties: false # 不允許額外屬性

    # --------------------------------------------------------------------------
    # Applicability Context (Structural Vocabulary) (適用上下文 - 結構化詞彙)
    # --------------------------------------------------------------------------

    applicability_context:         # 適用上下文
      type: object                 # 類型：物件
      description: >               # 描述
        宣告此文件內的規則可以使用的「適用上下文」。
        此上下文約束了出現在 rule.intent、rule.roles 與 rule.applies_to 中的鍵與值。

      properties:                  # 屬性內容

        intent:                    # 意圖
          type: map                # 類型：映射 (Map)
          description: >           # 描述
            宣告用於 rule.intent 的允許意圖維度與值。
          additional_properties:   # 額外屬性定義
            type: list             # 類型：清單
            item:                  # 項目內容
              type: string         # 類型：字串

        roles:                     # 角色
          type: map                # 類型：映射 (Map)
          description: >           # 描述
            宣告用於 rule.roles 的允許角色維度與值。
          additional_properties:   # 額外屬性定義
            type: list             # 類型：清單
            item:                  # 項目內容
              type: string         # 類型：字串
        applies_to:                # 適用於
          type: map                # 類型：映射 (Map)
          description: >           # 描述
            宣告用於 rule.applies_to 的允許適用維度與值。
          additional_properties:   # 額外屬性定義
            type: list             # 類型：清單
            item:                  # 項目內容
              type: string         # 類型：字串

      additional_properties: false # 不允許額外屬性

    # --------------------------------------------------------------------------
    # Rules (規則)
    # --------------------------------------------------------------------------
    rules:                    # 規則清單
      type: list              # 類型：清單
      description: >          # 描述
        # 此文件包含的規則清單。
        # 每一條規則「必須」符合 rule.schema.yaml 規範。
      item:                   # 清單項目
        ref: rule.schema.yaml # 引用：rule.schema.yaml