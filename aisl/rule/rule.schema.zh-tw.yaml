# ==============================================================================
# AISL 規則架構 (AISL Rule Schema)
# ------------------------------------------------------------------------------
# 定義單一 AISL 規則的結構模型。
#
# 規則是約束 AI 行為的最小規範單元。
# 本架構僅定義結構。
# 絕不可定義執行邏輯、政策強制執行、風險評估或決策流程。
# ==============================================================================

schema:                  # 架構
  name: AISL Rule Schema # 名稱
  version: 1.1           # 版本
  description: >         # 描述
    AISL 規則的結構架構。
    本架構定義規則如何被識別、分類、界定範圍，以及如何為了 AI 執行而進行描述。
    它並不定義規則如何被強制執行或如何運行。

# ------------------------------------------------------------------------------
# Rule Object (規則物件)
# ------------------------------------------------------------------------------

rule:               # 規則
  type: object      # 類型: 物件
  required:         # 必填項目:
    - id            # 識別碼
    - description   # 描述

  properties:       # 屬性:

    # --------------------------------------------------------------------------
    # Identity & Lifecycle (身份識別與生命週期)
    # --------------------------------------------------------------------------

    id:                  # 識別碼
      type: string       # 類型: 字串
      description: >     # 描述
        規則的唯一識別碼。
        此識別碼必須保持穩定，且絕不可重複使用。

    version:             # 版本
      type: string       # 類型: 字串
      description: >     # 描述
        規則定義的版本。此欄位僅具描述性質。

    status:              # 狀態
      type: string       # 類型: 字串
      enum:              # 列舉:
        - draft          # 草案
        - active         # 啟用
        - deprecated     # 廢止
      description: >     # 描述
        規則的生命週期狀態。此欄位僅具描述性質。

    title: # 標題                           # 選填項
      type: string # 類型: 字串
      description: > # 描述
        Short human-readable title summarizing the rule.
        # 摘要規則的簡短人類可讀標題。

    # --------------------------------------------------------------------------
    # Normative Content (規範性內容)
    # --------------------------------------------------------------------------

    description:         # 描述
      type: cnl          # 類型: 受控自然語言 (CNL)
      description: >     # 描述
        以受控自然語言 (CNL) 編寫的規範性規則描述。
        此欄位是 AI 行為約束的「唯一」來源。
        AI 必須嚴格遵循此描述，絕不可對其進行重新解釋。

    # --------------------------------------------------------------------------
    # Intent (Design Rationale) (意圖 - 設計原理)
    # --------------------------------------------------------------------------

    intent:              # 意圖
      type: list         # 類型: 清單
      description: >     # 描述
        描述規則背後的意圖、原理或設計考量的結構化自然語言暗示。
        這些暗示僅供參考，不具規範性。
      item:              # 項目內容
        struct: object   # 結構: 物件
        constraints:     # 約束: 必須且僅能有一個鍵 (Key)
          - EXACTLY_ONE_KEY
        key:             # 鍵
          type: string   # 類型: 字串
        value:           # 值
          type: string   # 類型: 字串

    # --------------------------------------------------------------------------
    # Roles (角色)
    # --------------------------------------------------------------------------

    roles:                # 角色
      type: list          # 類型: 清單
      description: >      # 描述
        指示相關執行者的結構化自然語言暗示。
        這些暗示「絕不可」被解讀為強制執行、授權或執行規則。
      item:               # 項目內容
        struct: object    # 結構: 物件
        constraints:      # 約束: 必須且僅能有一個鍵 (Key)
          - EXACTLY_ONE_KEY
        key:              # 鍵
          type: string    # 類型: 字串
        value:            # 值
          type: string    # 類型: 字串

    # --------------------------------------------------------------------------
    # Applicability Scope (適用範圍)
    # --------------------------------------------------------------------------

    applies_to:          # 適用於
      type: list         # 類型: 清單
      description: >     # 描述
        描述此規則何時適用的結構化自然語言暗示。
        每個條目代表一個適用性斷言。
        這些暗示僅提供上下文，「絕不可」引入可執行邏輯、推論或數值擴展。
      item:              # 項目內容
        struct: object   # 結構: 物件
        constraints:     # 約束: 必須且僅能有一個鍵 (Key)
          - EXACTLY_ONE_KEY
        key:             # 鍵
          type: string   # 類型: 字串
        value:           # 值
          type: string   # 類型: 字串

    # --------------------------------------------------------------------------
    # Risk Classification (風險分類)
    # --------------------------------------------------------------------------

    risk:                # 風險
      type: string       # 類型: 字串
      enum:              # 列舉:
        - bias           # 偏見
        - safety         # 安全
        - legal          # 法律
        - transparency   # 透明度
        - security       # 資安
      description: >     # 描述
        此規則旨在解決的高階 AI 風險類別。
        此欄位僅具描述性質，絕不可影響 AI 行為或執行決策。

    severity:            # 嚴重程度
      type: string       # 類型: 字串
      enum:              # 列舉:
        - low            # 低
        - medium         # 中
        - high           # 高
        - critical       # 緊急
      description: >     # 描述
        規則的參考性嚴重程度分類。
        此欄位僅具描述性質，絕不可影響執行行為。

# ------------------------------------------------------------------------------
# Explicit Non-Goals (明確非目標)
# ------------------------------------------------------------------------------

non_goals: # 非目標:
  - execution control # 執行控制
  - policy decision logic # 政策決策邏輯
  - risk scoring or prioritization # 風險評分或優先級排序
  - enforcement mechanism # 強制執行機制
  - runtime behavior modification # 運行時行為修改