policy:
  name: change_code_execution_policy
  version: 1.0
  domain: code
  type: change
  driver: none
  scope: internal

match:
  execution_intent:
    type: change
    target: code

authority:
  source: xim_scope
  description: >
    Change execution governs modification of existing production code.
    Modification boundaries are defined by XIM scope.
    Document alignment is validated at execution level but driven by generate policies.

rules:

  - id: EXEC-CHG-001
    description: Allow modifying existing production source code within XIM-declared scope.
    effect: allow

  - id: EXEC-CHG-002
    description: Change execution MUST NOT modify any test or documentation artifacts.
    constraints:
      forbidden_artifacts:
        - test_code
        - test_data
        - document

  - id: EXEC-CHG-003
    description: Scope boundaries MUST be declared by XIM and MUST NOT be inferred.
    constraints:
      scope_enforcement: strict
      scope_inference: forbidden

  - id: EXEC-CHG-004
    description: Code changes MUST align with finalized specifications.
    constraints:
      respect_specification: true

  - id: EXEC-CHG-005
    description: Existing test failures MUST NOT be resolved by modifying tests.
    constraints:
      resolve_test_failure_by_test_change: forbidden

  - id: EXEC-CHG-006
    description: Change execution MUST NOT introduce modifications outside declared intent boundaries.
    constraints:
      intent_boundary_enforcement: strict

verification:
  methods:
    - scope_check
    - diff_classification
    - test_execution

on_violation:
  action: reject
  message: Execution violates change code execution policy.

report:
  require:
    - xim_scope_reference
    - files_modified
    - specification_references
    - violated_rule_ids
