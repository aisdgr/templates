# ------------------------------------------------------------------------------
# 驗證目標 (Target)
# ------------------------------------------------------------------------------

target:
  # 受驗證規則的識別碼
  rule_id: RULE-001

  # 受驗證規則的版本
  rule_version: "1.0.0"

# ------------------------------------------------------------------------------
# 摘要 (Summary)
# ------------------------------------------------------------------------------

summary:
  # 整體驗證狀態：
  # - ok      : 未發現問題
  # - warning : 規則可用，但存在潛在問題
  # - failed  : 規則在結構或語義上無效
  status: warning

  # 依嚴重程度分類的問題計數
  issue_count:
    info: 1
    warning: 2
    high: 0

# ------------------------------------------------------------------------------
# 發現結果 (Findings)
# ------------------------------------------------------------------------------

findings:

  # --------------------------------------------------------------------------
  # 發現項目 1
  # --------------------------------------------------------------------------
  - id: FND-001
    category: cnl_violation # 語言規範違反
    location: description   # 描述
    severity: warning       # 警告

    message: >
      規則描述中使用了「視需要 (as needed)」短語，
      這在 CNL 規範性聲明中是不被允許的。

    suggestion: >
      請將「視需要」替換為強制的 CNL 關鍵字，例如
      「必須 (MUST)」或「不得 (MUST NOT)」，以確保約束具備可執行性。

  # --------------------------------------------------------------------------
  # 發現項目 2
  # --------------------------------------------------------------------------
  - id: FND-002
    category: ambiguity           # 歧義
    location: applies_to.section  # 適用範圍章節
    severity: warning             # 警告

    message: >
      適用範圍中引用了「目標檔案 (target files)」，
      但未提供明確的檔案範圍定義。

    suggestion: >
      請增加具體的檔案範圍定義（例如：特定的路徑或檔案模式），
      以防止產生推論式或過度擴張的範圍。

  # --------------------------------------------------------------------------
  # 發現項目 3
  # --------------------------------------------------------------------------
  - id: FND-003
    category: completeness  # 完整性
    location: roles         # 角色
    severity: info          # 資訊

    message: >
      此規則未指定任何角色。
      雖然這是被允許的，但在編寫規則集時可能會降低清晰度。

    suggestion: >
      建議增加角色定義，以釐清哪些主體
      （例如：AI、人員、系統）與此規則相關聯。