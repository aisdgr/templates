# ==============================================================================
# CODE-AR-03.yaml
# Modification of undeclared artifact types is forbidden.
# ==============================================================================

rule:
  id: CODE-AR-03
  execution_view: artifact_engineer

  constraint: >
    Code execution MUST NOT modify any artifact
    whose artifact type is not explicitly declared.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - artifact
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_implicit_artifact_modification
        - enforce_artifact_type_control

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - artifact_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - artifact_modification
      reason:
        - undeclared_artifact_type
        - artifact_type_violation

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - artifact_isolation
        - execution_safety
        - auditability
