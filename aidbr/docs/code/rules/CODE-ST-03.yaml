# ==============================================================================
# CODE-ST-03.yaml
# Structural refactoring and logic changes MUST NOT occur together.
# ==============================================================================

rule:
  id: CODE-ST-03
  execution_view: structure_engineer

  constraint: >
    Code execution MUST NOT perform structural refactoring
    and logic changes within the same execution.

  # ---------------------------------------------------------------------------
  # Boundary
  # ---------------------------------------------------------------------------
  boundary:
    domain:
      - code
    artifact:
      - source_code
    rule_category:
      - structural_change
    rule_domain:
      - CODE

  # ---------------------------------------------------------------------------
  # Governance
  # ---------------------------------------------------------------------------
  governance:
    version: 1.0.0
    status: draft
    owner: asdgr

    # -------------------------------------------------------------------------
    # Intent
    # -------------------------------------------------------------------------
    intent:
      rationale:
        - prevent_semantic_smuggling
        - isolate_structural_change_from_behavior
        - reduce_inference_creep

    # -------------------------------------------------------------------------
    # Responsibilities
    # -------------------------------------------------------------------------
    responsibilities:
      ai:
        - code_executor
      system:
        - structure_validator
        - behavior_validator

    # -------------------------------------------------------------------------
    # Applicability Context
    # -------------------------------------------------------------------------
    applicability_context:
      stage:
        - develop
      scope:
        - structural_refactoring
        - logic_modification
      risk:
        - architecture
        - correctness
      severity:
        - high
      reason:
        - mixed_structural_and_logic_change
        - semantic_drift_risk

    # -------------------------------------------------------------------------
    # Governance Impact
    # -------------------------------------------------------------------------
    governance_impact:
      level: blocking
      affected_capabilities:
        - architectural_stability
        - behavioral_integrity
        - auditability
